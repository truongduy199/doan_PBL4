        var rawTsx = "\nconst { useState, useEffect, useCallback, useRef, createContext, useContext } = React;\n\nconst RouterContext = createContext({\n  path: window.location.pathname || \"/login\",\n  navigate: (_to: string, _opts?: { replace?: boolean }) => {},\n});\n\nconst BrowserRouter: React.FC<{ children: React.ReactNode }> = ({ children }) => {\n  const [path, setPath] = useState<string>(\n    window.location.pathname === \"/\" || !window.location.pathname\n      ? \"/login\"\n      : window.location.pathname\n  );\n\n  useEffect(() => {\n    const onPop = () => setPath(window.location.pathname || \"/login\");\n    window.addEventListener(\"popstate\", onPop);\n    return () => window.removeEventListener(\"popstate\", onPop);\n  }, []);\n\n  const navigate = useCallback((to: string, opts?: { replace?: boolean }) => {\n    try {\n      if (opts && opts.replace) {\n        window.history.replaceState({}, \"\", to);\n      } else {\n        window.history.pushState({}, \"\", to);\n      }\n    } catch {\n      // ignore file:// history pushState error\n    }\n    setPath(to);\n  }, []);\n\n  return (\n    <RouterContext.Provider value={{ path, navigate }}>\n      {children}\n    </RouterContext.Provider>\n  );\n};\n\nconst useNavigate = () => useContext(RouterContext).navigate;\n\nconst Navigate: React.FC<{ to: string; replace?: boolean }> = ({ to, replace }) => {\n  const { navigate } = useContext(RouterContext);\n  useEffect(() => {\n    navigate(to, { replace });\n  }, [to, replace, navigate]);\n  return null;\n};\n\nconst Route: React.FC<{ path: string; element: React.ReactNode }> = ({ element }) => <>{element}</>;\n\nconst Routes: React.FC<{ children: React.ReactNode }> = ({ children }) => {\n  const { path } = useContext(RouterContext);\n  const list = React.Children.toArray(children) as React.ReactElement[];\n  for (const child of list) {\n    if (child && child.props && child.props.path === path) {\n      return <>{child.props.element}</>;\n    }\n  }\n  const wildcard = list.find((c) => c && c.props && c.props.path === \"*\");\n  return wildcard ? <>{wildcard.props.element}</> : null;\n};\n\n\n// === FILE: src/shared/types/index.ts ===\ntype SlotId = \"A1\" | \"A2\" | \"B1\" | \"B2\";\ntype PhysicalSlotStatus = \"Free\" | \"Occupied\" | \"Unknown\" | \"Fault\";\ntype DisplaySlotStatus =\n  | \"AVAILABLE\"\n  | \"RESERVED\"\n  | \"ASSIGNED_PENDING\"\n  | \"OCCUPIED\"\n  | \"UNKNOWN_OR_FAULT\";\ntype BookingStatus =\n  | \"Reserved\"\n  | \"Checkin_pending\"\n  | \"Checked_in\"\n  | \"Completed\"\n  | \"Expired\"\n  | \"Cancelled\";\ntype SessionStatus =\n  | \"Entry_pending\"\n  | \"Active\"\n  | \"Exit_pending\"\n  | \"Closed\"\n  | \"Cancelled\";\ntype ParkingStatus =\n  | \"Not_arrived\"\n  | \"Parking_pending\"\n  | \"Parked_confirmed\"\n  | \"Parking_review_required\"\n  | \"Parking_timeout\";\ninterface UserVehicle {\n  vehicle_id: number;\n  plate_number: string;\n  plate_display: string;\n  status: \"Active\" | \"Disabled\";\n}\ninterface UserFaceTemplateInfo {\n  has_active_template: boolean;\n  template_id: number | null;\n  model_id: string | null;\n  model_version: string | null;\n  liveness_status: string | null;\n  status: string | null;\n  updated_at: string | null;\n  updated_at_vn: string | null;\n}\ninterface UserProfile {\n  user_id: number;\n  username: string;\n  display_name: string;\n  role: \"user\" | \"admin\";\n  status: \"Active\" | \"Disabled\";\n  vehicles: UserVehicle[];\n  face_template: UserFaceTemplateInfo;\n  server_time?: string;\n}\ninterface ParkingSlotView {\n  slot_id: SlotId;\n  sensor_id: string;\n  physical_status: PhysicalSlotStatus;\n  display_status: DisplaySlotStatus;\n  label_vi: string;\n  is_available: boolean;\n  is_bookable: boolean;\n  sensor_fresh: boolean;\n  is_my_booking: boolean;\n  is_my_session: boolean;\n  booking_id: string | null;\n  booking_status: BookingStatus | null;\n  expires_at: string | null;\n  expires_at_vn: string | null;\n  remaining_seconds: number | null;\n  plate_number: string | null;\n  plate_display: string | null;\n  updated_at: string | null;\n  updated_at_vn: string | null;\n  last_seen_at: string | null;\n  last_seen_at_vn: string | null;\n  // Admin-only fields\n  active_booking_id?: string | null;\n  reserved_session_id?: string | null;\n  session_status?: SessionStatus | null;\n  parking_status?: ParkingStatus | null;\n  entry_time?: string | null;\n  entry_time_vn?: string | null;\n  booked_by_user_id?: number | null;\n  booked_by_username?: string | null;\n  booked_by_display_name?: string | null;\n  last_boot_id?: string | null;\n  last_sequence?: number | null;\n}\ninterface SlotsResponse {\n  slots: ParkingSlotView[];\n  available_count: number;\n  total_count: number;\n  slot_stale_seconds: number;\n  server_time: string;\n  server_time_vn: string;\n}\ninterface BookingDTO {\n  booking_id: string;\n  user_id: number;\n  vehicle_id: number;\n  plate_number: string | null;\n  plate_display: string | null;\n  slot_id: SlotId;\n  status: BookingStatus;\n  created_at: string;\n  created_at_vn: string;\n  expires_at: string;\n  expires_at_vn: string;\n  checkin_started_at: string | null;\n  checked_in_at: string | null;\n  completed_at: string | null;\n  cancelled_at: string | null;\n  checkin_event_id: string | null;\n  remaining_seconds: number;\n  can_cancel: boolean;\n  server_time: string;\n  server_time_vn: string;\n  session_id?: string | null;\n  session_status?: SessionStatus | null;\n  parking_status?: ParkingStatus | null;\n  entry_time?: string | null;\n  entry_time_vn?: string | null;\n  username?: string;\n  display_name?: string;\n}\ninterface SessionDTO {\n  session_id: string;\n  plate_number: string;\n  plate_display: string;\n  user_id?: number | null;\n  username?: string | null;\n  display_name?: string | null;\n  vehicle_id?: number | null;\n  booking_id: string | null;\n  booking_status?: BookingStatus | null;\n  booking_expires_at?: string | null;\n  booking_expires_at_vn?: string | null;\n  booking_remaining_seconds?: number;\n  assigned_slot_id: SlotId;\n  status: SessionStatus;\n  parking_status: ParkingStatus;\n  ocr_confidence: number | null;\n  entry_time: string | null;\n  entry_time_vn: string | null;\n  exit_time: string | null;\n  exit_time_vn: string | null;\n  created_at: string | null;\n  created_at_vn: string | null;\n}\ninterface ManualReviewItem {\n  review_type: \"GATE_EVENT\" | \"PARKING_ANOMALY\";\n  event_id: string;\n  gate_id: \"IN\" | \"OUT\";\n  device_id: string;\n  session_id: string | null;\n  booking_id: string | null;\n  plate_number: string | null;\n  plate_display: string | null;\n  slot_id: SlotId | null;\n  decision: \"Pending\" | \"Approved\" | \"Denied\" | \"Review_required\";\n  passage_status: string;\n  reason_code: string | null;\n  liveness_status: string | null;\n  liveness_score: number | null;\n  reviewer_id: number | null;\n  reviewer_username: string | null;\n  review_reason: string | null;\n  created_at: string | null;\n  created_at_vn: string | null;\n  decided_at: string | null;\n}\ninterface DeviceSensorHealth {\n  slot_id: SlotId;\n  sensor_id: string;\n  physical_status: PhysicalSlotStatus;\n  is_fresh: boolean;\n  is_fault: boolean;\n  age_seconds: number | null;\n  stale_threshold_seconds: number;\n  last_boot_id: string | null;\n  last_sequence: number | null;\n  last_seen_at: string | null;\n  last_seen_at_vn: string | null;\n}\ninterface RealtimeEnvelope {\n  event_type: string;\n  server_time: string;\n  server_time_vn?: string;\n  payload: Record<string, unknown>;\n}\n\n// Legacy type aliases kept so any auxiliary subcomponents compile cleanly\ntype SlotStatus = \"FREE\" | \"ASSIGNED\" | \"OCCUPIED\" | \"WRONG_VEHICLE\" | \"FAULT\";\ninterface ParkingSlot {\n  slot_id: SlotId;\n  status: SlotStatus;\n  assigned_session_id?: string | null;\n  current_plate?: string | null;\n  entry_time?: string | null;\n  updated_at: string;\n}\ninterface ParkingSession {\n  session_id: string;\n  plate_number: string;\n  slot_id: SlotId;\n  status: \"ACTIVE\" | \"COMPLETED\" | \"REJECTED\" | \"REVIEW_REQUIRED\";\n  entry_time: string;\n  exit_time?: string | null;\n}\ninterface ReviewRequest {\n  request_id: string;\n  session_id: string;\n  plate_number: string;\n  reason_code: string;\n  similarity_score: number;\n  status: \"PENDING\" | \"APPROVED\" | \"REJECTED\";\n  created_at: string;\n}\ninterface SystemEventLog {\n  id: string;\n  type: string;\n  title: string;\n  description: string;\n  timestamp: string;\n  severity: \"info\" | \"warning\" | \"success\" | \"error\";\n}\n\n\n// === FILE: src/services/api.client.ts ===\n/**\n * Centralized REST & Realtime (WebSocket / SSE) Client for Smart Parking FastAPI Backend.\n * Automatically adapts to localhost, LAN IP (192.168.x.x), or Public HTTPS Tunnel / Cloud URL\n * so external viewers never hit hardcoded 127.0.0.1 on their own device.\n */\n\nconst TOKEN_STORAGE_KEY = \"pbl4_smart_parking_jwt_token\";\n\nfunction resolveApiBaseUrl(): string {\n  const envUrl = (\"http://127.0.0.1:8000\" as string | undefined)?.replace(/\\/+$/, \"\");\n  if (typeof window === \"undefined\") {\n    return envUrl || \"http://127.0.0.1:8000\";\n  }\n  const { protocol, hostname, port, origin } = window.location;\n  // If served directly from the unified FastAPI server (port 8000) or via an HTTPS public tunnel (port 80/443)\n  if (port === \"8000\" || port === \"\" || protocol === \"https:\") {\n    return origin;\n  }\n  // If served from separate frontend dev server (port 5173) over LAN IP or localhost\n  if (hostname && hostname !== \"localhost\" && hostname !== \"127.0.0.1\") {\n    return `${protocol}//${hostname}:8000`;\n  }\n  return envUrl || \"http://127.0.0.1:8000\";\n}\n\nfunction resolveWsUrl(apiBase: string): string {\n  const envWs = \"ws://127.0.0.1:8000/api/ws\" as string | undefined;\n  if (typeof window !== \"undefined\") {\n    const { protocol, hostname, port, host } = window.location;\n    const wsProto = protocol === \"https:\" ? \"wss:\" : \"ws:\";\n    if (port === \"8000\" || port === \"\" || protocol === \"https:\") {\n      return `${wsProto}//${host}/api/ws`;\n    }\n    if (hostname && hostname !== \"localhost\" && hostname !== \"127.0.0.1\") {\n      return `${wsProto}//${hostname}:8000/api/ws`;\n    }\n  }\n  return envWs || `${apiBase.replace(/^http/, \"ws\")}/api/ws`;\n}\nconst API_BASE_URL: string = resolveApiBaseUrl();\nconst WS_URL: string = resolveWsUrl(API_BASE_URL);\nclass ApiError extends Error {\n  public readonly status: number;\n  public readonly reasonCode: string;\n  public readonly details: Record<string, unknown>;\n\n  constructor(\n    status: number,\n    reasonCode: string,\n    message: string,\n    details: Record<string, unknown> = {}\n  ) {\n    super(message);\n    this.name = \"ApiError\";\n    this.status = status;\n    this.reasonCode = reasonCode;\n    this.details = details;\n  }\n}\nclass ApiClient {\n  static getToken(): string | null {\n    try {\n      return window.sessionStorage.getItem(TOKEN_STORAGE_KEY);\n    } catch {\n      return null;\n    }\n  }\n\n  static setToken(token: string | null): void {\n    try {\n      if (token) {\n        window.sessionStorage.setItem(TOKEN_STORAGE_KEY, token);\n      } else {\n        window.sessionStorage.removeItem(TOKEN_STORAGE_KEY);\n      }\n    } catch {\n      // ignore storage errors\n    }\n  }\n\n  static async request<T>(\n    path: string,\n    options: RequestInit = {}\n  ): Promise<T> {\n    const token = ApiClient.getToken();\n    const headers: Record<string, string> = {\n      Accept: \"application/json\",\n      ...(options.headers as Record<string, string> | undefined),\n    };\n    if (options.body && !headers[\"Content-Type\"]) {\n      headers[\"Content-Type\"] = \"application/json\";\n    }\n    if (token) {\n      headers[\"Authorization\"] = `Bearer ${token}`;\n    }\n\n    const url = path.startsWith(\"http\")\n      ? path\n      : `${API_BASE_URL}${path.startsWith(\"/\") ? \"\" : \"/\"}${path}`;\n\n    let response: Response;\n    try {\n      response = await fetch(url, {\n        ...options,\n        headers,\n        credentials: \"include\",\n      });\n    } catch (networkErr) {\n      throw new ApiError(\n        0,\n        \"NETWORK_ERROR\",\n        `Kh\u00f4ng th\u1ec3 k\u1ebft n\u1ed1i t\u1edbi m\u00e1y ch\u1ee7 FastAPI (${API_BASE_URL}). Vui l\u00f2ng ki\u1ec3m tra Edge Server \u0111ang ch\u1ea1y.`,\n        { originalError: String(networkErr) }\n      );\n    }\n\n    let payload: Record<string, unknown> = {};\n    try {\n      payload = (await response.json()) as Record<string, unknown>;\n    } catch {\n      payload = {};\n    }\n\n    if (!response.ok) {\n      const reasonCode =\n        (payload.reason_code as string) ||\n        (payload.error as string) ||\n        `HTTP_${response.status}`;\n      const message =\n        (payload.message as string) ||\n        (payload.detail as string) ||\n        `L\u1ed7i m\u00e1y ch\u1ee7 (HTTP ${response.status})`;\n      const details =\n        (payload.details as Record<string, unknown>) || {};\n      throw new ApiError(response.status, reasonCode, message, details);\n    }\n\n    return payload as unknown as T;\n  }\n\n  static get<T>(path: string, headers?: Record<string, string>): Promise<T> {\n    return ApiClient.request<T>(path, { method: \"GET\", headers });\n  }\n\n  static post<T>(\n    path: string,\n    body?: unknown,\n    headers?: Record<string, string>\n  ): Promise<T> {\n    return ApiClient.request<T>(path, {\n      method: \"POST\",\n      body: body !== undefined ? JSON.stringify(body) : undefined,\n      headers,\n    });\n  }\n\n  /**\n   * Connect to FastAPI realtime WebSocket (/api/ws) with automatic SSE (/api/events/stream) fallback.\n   */\n  static subscribeRealtime(\n    onEvent: (envelope: RealtimeEnvelope) => void,\n    onStatusChange?: (connected: boolean) => void\n  ): () => void {\n    let closed = false;\n    let ws: WebSocket | null = null;\n    let sse: EventSource | null = null;\n    let reconnectTimer: number | null = null;\n\n    const cleanup = () => {\n      if (reconnectTimer !== null) {\n        window.clearTimeout(reconnectTimer);\n        reconnectTimer = null;\n      }\n      if (ws) {\n        try {\n          ws.close();\n        } catch {\n          // ignore\n        }\n        ws = null;\n      }\n      if (sse) {\n        try {\n          sse.close();\n        } catch {\n          // ignore\n        }\n        sse = null;\n      }\n    };\n\n    const connectSSE = () => {\n      if (closed) return;\n      try {\n        sse = new EventSource(`${API_BASE_URL}/api/events/stream`, {\n          withCredentials: true,\n        });\n        sse.onopen = () => {\n          onStatusChange?.(true);\n        };\n        sse.onmessage = (ev) => {\n          try {\n            const parsed = JSON.parse(ev.data) as RealtimeEnvelope;\n            onEvent(parsed);\n          } catch {\n            // ignore malformed frame\n          }\n        };\n        sse.onerror = () => {\n          onStatusChange?.(false);\n        };\n      } catch {\n        onStatusChange?.(false);\n      }\n    };\n\n    const connectWS = () => {\n      if (closed) return;\n      try {\n        ws = new WebSocket(WS_URL);\n        ws.onopen = () => {\n          onStatusChange?.(true);\n        };\n        ws.onmessage = (ev) => {\n          try {\n            const parsed = JSON.parse(ev.data) as RealtimeEnvelope;\n            onEvent(parsed);\n          } catch {\n            // ignore malformed frame\n          }\n        };\n        ws.onerror = () => {\n          onStatusChange?.(false);\n        };\n        ws.onclose = () => {\n          onStatusChange?.(false);\n          if (!closed) {\n            reconnectTimer = window.setTimeout(connectWS, 3000);\n          }\n        };\n      } catch {\n        connectSSE();\n      }\n    };\n\n    connectWS();\n\n    return () => {\n      closed = true;\n      cleanup();\n    };\n  }\n}\n\n\n// === FILE: src/services/auth.service.ts ===\ninterface LoginResponse {\n  access_token: string;\n  token_type: string;\n  expires_in: number;\n  user: UserProfile;\n  server_time: string;\n}\nclass AuthService {\n  static async login(username: string, password: string): Promise<LoginResponse> {\n    const res = await ApiClient.post<LoginResponse>(\"/api/auth/login\", {\n      username,\n      password,\n    });\n    ApiClient.setToken(res.access_token);\n    return res;\n  }\n\n  static async logout(): Promise<void> {\n    try {\n      await ApiClient.post(\"/api/auth/logout\");\n    } finally {\n      ApiClient.setToken(null);\n    }\n  }\n\n  static async getCurrentUser(): Promise<UserProfile> {\n    return ApiClient.get<UserProfile>(\"/api/me\");\n  }\n}\n\n\n// === FILE: src/services/parking.service.ts ===\ninterface CurrentBookingResponse {\n  booking: BookingDTO | null;\n  server_time: string;\n  server_time_vn: string;\n}\ninterface UserHistoryResponse {\n  bookings: BookingDTO[];\n  sessions: SessionDTO[];\n  limit: number;\n  offset: number;\n  server_time: string;\n  server_time_vn: string;\n}\nclass ParkingService {\n  /**\n   * L\u1ea5y tr\u1ea1ng th\u00e1i 4 \u00f4 \u0111\u1ed7 (A1, A2, B1, B2) k\u00e8m server_time t\u1eeb FastAPI + MySQL.\n   */\n  static async getSlots(): Promise<SlotsResponse> {\n    return ApiClient.get<SlotsResponse>(\"/api/slots\");\n  }\n\n  /**\n   * \u0110\u1eb7t gi\u1eef \u00f4 60 ph\u00fat cho xe \u0111\u1ecbnh danh c\u1ee7a USER \u0111ang \u0111\u0103ng nh\u1eadp.\n   */\n  static async createBooking(\n    vehicleId: number,\n    slotId: SlotId,\n    idempotencyKey?: string\n  ): Promise<BookingDTO> {\n    const headers: Record<string, string> = {};\n    if (idempotencyKey) {\n      headers[\"X-Idempotency-Key\"] = idempotencyKey;\n    }\n    return ApiClient.post<BookingDTO>(\n      \"/api/bookings\",\n      {\n        vehicle_id: vehicleId,\n        slot_id: slotId,\n        idempotency_key: idempotencyKey,\n      },\n      headers\n    );\n  }\n\n  /**\n   * L\u1ea5y booking \u0111ang hi\u1ec7u l\u1ef1c c\u1ee7a USER k\u00e8m server_time \u0111\u1ec3 \u0111\u1ed3ng b\u1ed9 \u0111\u1ed3ng h\u1ed3 \u0111\u1ebfm ng\u01b0\u1ee3c khi F5.\n   */\n  static async getCurrentBooking(): Promise<CurrentBookingResponse> {\n    return ApiClient.get<CurrentBookingResponse>(\"/api/bookings/current\");\n  }\n\n  /**\n   * H\u1ee7y \u0111\u1eb7t ch\u1ed7 khi c\u00f2n \u1edf tr\u1ea1ng th\u00e1i Reserved v\u00e0 ch\u01b0a b\u01b0\u1edbc v\u00e0o l\u01b0\u1ee3t check-in t\u1ea1i c\u1ed5ng.\n   */\n  static async cancelBooking(bookingId: string): Promise<BookingDTO> {\n    return ApiClient.post<BookingDTO>(`/api/bookings/${bookingId}/cancel`);\n  }\n\n  /**\n   * L\u1ea5y l\u1ecbch s\u1eed \u0111\u1eb7t ch\u1ed7 v\u00e0 l\u1ecbch s\u1eed g\u1eedi xe c\u1ee7a ch\u00ednh USER \u0111ang \u0111\u0103ng nh\u1eadp.\n   */\n  static async getMyHistory(params?: {\n    bookingStatus?: string;\n    sessionStatus?: string;\n    limit?: number;\n    offset?: number;\n  }): Promise<UserHistoryResponse> {\n    const q = new URLSearchParams();\n    if (params?.bookingStatus) q.set(\"booking_status\", params.bookingStatus);\n    if (params?.sessionStatus) q.set(\"session_status\", params.sessionStatus);\n    if (params?.limit) q.set(\"limit\", String(params.limit));\n    if (params?.offset) q.set(\"offset\", String(params.offset));\n    const qs = q.toString();\n    return ApiClient.get<UserHistoryResponse>(\n      `/api/me/history${qs ? `?${qs}` : \"\"}`\n    );\n  }\n}\n\n\n// === FILE: src/services/session.service.ts ===\ninterface AdminSessionsResponse {\n  sessions: SessionDTO[];\n  count: number;\n  server_time: string;\n  server_time_vn: string;\n}\ninterface AdminBookingsResponse {\n  bookings: BookingDTO[];\n  count: number;\n  server_time: string;\n  server_time_vn: string;\n}\ninterface AdminDevicesResponse {\n  overall_status: \"HEALTHY\" | \"DEGRADED_OR_STALE\";\n  slot_stale_seconds: number;\n  sensors: DeviceSensorHealth[];\n  server_time: string;\n  server_time_vn: string;\n}\nclass SessionService {\n  static async listAdminSessions(status?: string): Promise<AdminSessionsResponse> {\n    const qs = status ? `?status=${encodeURIComponent(status)}` : \"\";\n    return ApiClient.get<AdminSessionsResponse>(`/api/admin/sessions${qs}`);\n  }\n\n  static async listAdminBookings(status?: string): Promise<AdminBookingsResponse> {\n    const qs = status ? `?status=${encodeURIComponent(status)}` : \"\";\n    return ApiClient.get<AdminBookingsResponse>(`/api/admin/bookings${qs}`);\n  }\n\n  static async getAdminDevices(): Promise<AdminDevicesResponse> {\n    return ApiClient.get<AdminDevicesResponse>(\"/api/admin/devices\");\n  }\n}\n\n\n// === FILE: src/services/review.service.ts ===\ninterface AdminReviewsResponse {\n  reviews: ManualReviewItem[];\n  count: number;\n  server_time: string;\n  server_time_vn: string;\n}\nclass ReviewService {\n  static async listAdminReviews(includeResolved = false): Promise<AdminReviewsResponse> {\n    return ApiClient.get<AdminReviewsResponse>(\n      `/api/admin/reviews?include_resolved=${includeResolved ? \"true\" : \"false\"}`\n    );\n  }\n\n  static async submitDecision(\n    eventId: string,\n    action: \"APPROVE\" | \"DENY\",\n    reason: string\n  ): Promise<Record<string, unknown>> {\n    return ApiClient.post<Record<string, unknown>>(\n      `/api/admin/reviews/${encodeURIComponent(eventId)}/decision`,\n      { action, reason }\n    );\n  }\n}\n\n\n// === FILE: src/features/user-portal/driverRoutes.ts ===\ninterface DriverRouteConfig {\n  slotId: SlotId;\n  row: \"A\" | \"B\";\n  wing: \"LEFT\" | \"RIGHT\";\n  zoneLabel: string;\n  turnDirection: \"LEFT\" | \"RIGHT\";\n  passesRowA: boolean;\n  distanceMeters: number;\n  steeringPeakDeg: number;\n  turnLabelVi: string;\n  hudStage2: string;\n  hudStage3: string;\n  radarWaypoints: [number, number][];\n  radarPathPoints: string;\n  targetBay: { cx: number; cy: number };\n}\ninterface DriverPose {\n  phaseIndex: 0 | 1 | 2 | 3;\n  phaseTitle: string;\n  hudInstruction: string;\n  barrierAngleDeg: number;\n  barrierIsOpen: boolean;\n  speedKmh: number;\n  steeringAngleDeg: number;\n  turnSignal: \"NONE\" | \"LEFT\" | \"RIGHT\";\n  gear: \"D\" | \"P\";\n  remainingMeters: number;\n  radarCarX: number;\n  radarCarY: number;\n  radarCarHeadingDeg: number;\n  roadScrollOffset: number;\n  worldScale: number;\n  worldShiftX: number;\n  worldRotateDeg: number;\n}\nconst DRIVER_ROUTES: Record<SlotId, DriverRouteConfig> = {\n  A1: {\n    slotId: \"A1\",\n    row: \"A\",\n    wing: \"LEFT\",\n    zoneLabel: \"D\u00e3y A \u2022 C\u00e1nh Tr\u00e1i (G\u1ea7n C\u1ed5ng V\u00e0o)\",\n    turnDirection: \"LEFT\",\n    passesRowA: false,\n    distanceMeters: 12,\n    steeringPeakDeg: -75,\n    turnLabelVi: \"Ti\u1ebfn v\u00e0o D\u00e3y A, b\u1eadt xi-nhan v\u00e0 \u0111\u00e1nh l\u00e1i R\u1ebc TR\u00c1I v\u00e0o \u00f4 A1\",\n    hudStage2: \"Ti\u1ebfn th\u1eb3ng 12m qua barie d\u1ecdc l\u00e0n trung t\u00e2m t\u1edbi \u0111i\u1ec3m r\u1ebd D\u00e3y A\",\n    hudStage3: \"B\u1eadt xi-nhan TR\u00c1I, \u0111\u00e1nh v\u00f4 l\u0103ng -75\u00b0 r\u1ebd v\u00e0o khoang \u0111\u1ed7 A1\",\n    radarWaypoints: [\n      [100, 178],\n      [100, 118],\n      [46, 118],\n    ],\n    radarPathPoints: \"100,178 100,118 46,118\",\n    targetBay: { cx: 46, cy: 118 },\n  },\n  A2: {\n    slotId: \"A2\",\n    row: \"A\",\n    wing: \"RIGHT\",\n    zoneLabel: \"D\u00e3y A \u2022 C\u00e1nh Ph\u1ea3i (G\u1ea7n C\u1ed5ng V\u00e0o)\",\n    turnDirection: \"RIGHT\",\n    passesRowA: false,\n    distanceMeters: 12,\n    steeringPeakDeg: 75,\n    turnLabelVi: \"Ti\u1ebfn v\u00e0o D\u00e3y A, b\u1eadt xi-nhan v\u00e0 \u0111\u00e1nh l\u00e1i R\u1ebc PH\u1ea2I v\u00e0o \u00f4 A2\",\n    hudStage2: \"Ti\u1ebfn th\u1eb3ng 12m qua barie d\u1ecdc l\u00e0n trung t\u00e2m t\u1edbi \u0111i\u1ec3m r\u1ebd D\u00e3y A\",\n    hudStage3: \" 1 | 2 | 3;\n  shortLabel: string;\n  title: string;\n  targetProgress: number;\n}[] = [\n  {\n    index: 0,\n    shortLabel: \"1. C\u1ed5ng V\u00e0o & Barie\",\n    title: \"B\u01b0\u1edbc 1/4: D\u1eebng t\u1ea1i Gate IN \u2022 Nh\u1eadn di\u1ec7n & M\u1edf Barie\",\n    targetProgress: 0.02,\n  },\n  {\n    index: 1,\n    shortLabel: \"2. Tr\u1ee5c Ch\u00ednh\",\n    title: \"B\u01b0\u1edbc 2/4: Ti\u1ebfn qua c\u1ed5ng d\u1ecdc tr\u1ee5c \u0111\u01b0\u1eddng trung t\u00e2m\",\n    targetProgress: 0.38,\n  },\n  {\n    index: 2,\n    shortLabel: \"3. \u0110\u00e1nh L\u00e1i V\u00e0o \u00d4\",\n    title: \"B\u01b0\u1edbc 3/4: B\u1eadt xi-nhan & \u0110\u00e1nh l\u00e1i r\u1ebd v\u00e0o \u0111\u00fang \u00f4 \u0111\u1ed7\",\n    targetProgress: 0.7,\n  },\n  {\n    index: 3,\n    shortLabel: \"4. \u0110\u1ed7 Ho\u00e0n T\u1ea5t\",\n    title: \"B\u01b0\u1edbc 4/4: C\u0103n th\u1eb3ng xe v\u00e0o ch\u00ednh gi\u1eefa \u00f4 \u2022 Ho\u00e0n t\u1ea5t\",\n    targetProgress: 1.0,\n  },\n];\n\nfunction clamp01(val: number): number {\n  return Math.max(0, Math.min(1, val));\n}\n\nfunction smoothStep(t: number): number {\n  const c = clamp01(t);\n  return c * c * (3 - 2 * c);\n}\n\n/**\n * Pure deterministic kinematics function mapping normalized animation progress [0..1]\n * to continuous cockpit pose (barrier angle, steering angle, radar position, speed, HUD).\n */\nfunction evaluateDriverPose(slotId: SlotId, rawProgress: number): DriverPose {\n  const route = DRIVER_ROUTES[slotId] || DRIVER_ROUTES.A1;\n  const p = clamp01(rawProgress);\n  const [pStart, pTurn, pEnd] = route.radarWaypoints;\n  const sign = route.turnDirection === \"LEFT\" ? -1 : 1;\n\n  // Phase 0: 0.00 -> 0.25 (Gate IN verification & smooth barrier arm lift 0 -> 85 deg)\n  if (p < 0.25) {\n    const local = p / 0.25;\n    const liftT = smoothStep((local - 0.25) / 0.65);\n    const barrierAngleDeg = Math.round(liftT * 85);\n    const barrierIsOpen = barrierAngleDeg >= 60;\n    return {\n      phaseIndex: 0,\n      phaseTitle: DRIVER_PHASE_CHECKPOINTS[0].title,\n      hudInstruction: barrierIsOpen\n        ? \"Barie c\u1ed5ng v\u00e0o \u0110\u00c3 M\u1ede HO\u00c0N TO\u00c0N \u2014 B\u1eaft \u0111\u1ea7u ti\u1ebfn xe qua c\u1ed5ng\"\n        : \"\u0110ang qu\u00e9t \u0111\u1ed1i so\u00e1t Bi\u1ec3n s\u1ed1 & Khu\u00f4n m\u1eb7t 1:1 t\u1ea1i Gate IN...\",\n      barrierAngleDeg,\n      barrierIsOpen,\n      speedKmh: barrierIsOpen ? Math.round(liftT * 6) : 0,\n      steeringAngleDeg: 0,\n      turnSignal: \"NONE\",\n      gear: \"D\",\n      remainingMeters: route.distanceMeters,\n      radarCarX: pStart[0],\n      radarCarY: pStart[1],\n      radarCarHeadingDeg: 0,\n      roadScrollOffset: 0,\n      worldScale: 1 + liftT * 0.04,\n      worldShiftX: 0,\n      worldRotateDeg: 0,\n    };\n  }\n\n  // Phase 1: 0.25 -> 0.55 (Cruise straight along central aisle to target Row A or Row B)\n  if (p < 0.55) {\n    const local = smoothStep((p - 0.25) / 0.3);\n    const carY = pStart[1] + (pTurn[1] - pStart[1]) * local;\n    const remM = Math.max(\n      3,\n      Math.round(route.distanceMeters * (1 - local * 0.72))\n    );\n    return {\n      phaseIndex: 1,\n      phaseTitle: DRIVER_PHASE_CHECKPOINTS[1].title,\n      hudInstruction: route.hudStage2,\n      barrierAngleDeg: 85,\n      barrierIsOpen: true,\n      speedKmh: Math.round(8 + Math.sin(local * Math.PI) * 7),\n      steeringAngleDeg: 0,\n      turnSignal: local > 0.72 ? route.turnDirection : \"NONE\",\n      gear: \"D\",\n      remainingMeters: remM,\n      radarCarX: pStart[0],\n      radarCarY: carY,\n      radarCarHeadingDeg: 0,\n      roadScrollOffset: (local * (route.passesRowA ? 180 : 100)) % 40,\n      worldScale: 1.04 + local * (route.passesRowA ? 0.24 : 0.16),\n      worldShiftX: 0,\n      worldRotateDeg: 0,\n    };\n  }\n\n  // Phase 2: 0.55 -> 0.85 (Turn steering wheel into A1/A2/B1/B2 bay)\n  if (p < 0.85) {\n    const local = smoothStep((p - 0.55) / 0.3);\n    const steerEnvelope = Math.sin(local * Math.PI);\n    const steeringAngleDeg = Math.round(route.steeringPeakDeg * steerEnvelope);\n    const carX = pTurn[0] + (pEnd[0] - pTurn[0]) * local;\n    const heading = sign * 90 * Math.min(1, local * 1.25);\n    const remM = Math.max(1, Math.round(3 * (1 - local)));\n    return {\n      phaseIndex: 2,\n      phaseTitle: DRIVER_PHASE_CHECKPOINTS[2].title,\n      hudInstruction: route.hudStage3,\n      barrierAngleDeg: 85,\n      barrierIsOpen: true,\n      speedKmh: Math.max(4, Math.round(9 * (1 - local * 0.45))),\n      steeringAngleDeg,\n      turnSignal: route.turnDirection,\n      gear: \"D\",\n      remainingMeters: remM,\n      radarCarX: carX,\n      radarCarY: pTurn[1],\n      radarCarHeadingDeg: heading,\n      roadScrollOffset: (local * 60) % 40,\n      worldScale: (route.passesRowA ? 1.28 : 1.2) + local * 0.14,\n      worldShiftX: -sign * local * 115,\n      worldRotateDeg: -sign * steerEnvelope * 3.5,\n    };\n  }\n\n  // Phase 3: 0.85 -> 1.00 (Straighten wheel, decelerate smoothly to 0 km/h, shift D -> P)\n  const local = smoothStep((p - 0.85) / 0.15);\n  const isStopped = p >= 0.97;\n  return {\n    phaseIndex: 3,\n    phaseTitle: DRIVER_PHASE_CHECKPOINTS[3].title,\n    hudInstruction: `Xe \u0111\u00e3 \u0111\u1ed7 ngay ng\u1eafn ch\u00ednh gi\u1eefa \u00f4 ${slotId}. C\u1ea3m bi\u1ebfn IR_${slotId} ghi nh\u1eadn v\u1ecb tr\u00ed an to\u00e0n.`,\n    barrierAngleDeg: 85,\n    barrierIsOpen: true,\n    speedKmh: isStopped ? 0 : Math.round(4 * (1 - local)),\n    steeringAngleDeg: 0,\n    turnSignal: \"NONE\",\n    gear: isStopped ? \"P\" : \"D\",\n    remainingMeters: 0,\n    radarCarX: pEnd[0],\n    radarCarY: pEnd[1],\n    radarCarHeadingDeg: sign * 90,\n    roadScrollOffset: 0,\n    worldScale: (route.passesRowA ? 1.42 : 1.34) + local * 0.06,\n    worldShiftX: -sign * 115,\n    worldRotateDeg: 0,\n  };\n}\n\n\n// === FILE: src/features/user-portal/FirstPersonDriverModal.tsx ===\n\n\n\ninterface FirstPersonDriverModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  slotId: SlotId;\n  plateDisplay: string;\n  bookingId: string;\n}\n\nconst BASE_DURATION_MS = 9600;\nconst FirstPersonDriverModal: React.FC<FirstPersonDriverModalProps> = ({\n  isOpen,\n  onClose,\n  slotId,\n  plateDisplay,\n  bookingId,\n}) => {\n  const [progress, setProgress] = useState<number>(0);\n  const [isPlaying, setIsPlaying] = useState<boolean>(true);\n  const [speedMultiplier, setSpeedMultiplier] = useState<1 | 1.5>(1);\n  const lastFrameTimeRef = useRef<number | null>(null);\n  const rafIdRef = useRef<number | null>(null);\n\n  const route = DRIVER_ROUTES[slotId] || DRIVER_ROUTES.A1;\n  const pose = evaluateDriverPose(slotId, progress);\n\n  // Reset & start smooth playback whenever modal opens or slot changes\n  useEffect(() => {\n    if (!isOpen) return;\n    setProgress(0);\n    setIsPlaying(true);\n    lastFrameTimeRef.current = null;\n  }, [isOpen, slotId]);\n\n  // Smooth 60fps requestAnimationFrame timeline loop (100% client-side, zero network/hardware calls)\n  useEffect(() => {\n    if (!isOpen || !isPlaying) {\n      lastFrameTimeRef.current = null;\n      return;\n    }\n\n    const tick = (nowMs: number) => {\n      if (lastFrameTimeRef.current === null) {\n        lastFrameTimeRef.current = nowMs;\n      }\n      const deltaMs = Math.min(100, nowMs - lastFrameTimeRef.current);\n      lastFrameTimeRef.current = nowMs;\n\n      setProgress((prev) => {\n        const next = prev + (deltaMs * speedMultiplier) / BASE_DURATION_MS;\n        if (next >= 1) {\n          setIsPlaying(false);\n          return 1;\n        }\n        return next;\n      });\n      rafIdRef.current = window.requestAnimationFrame(tick);\n    };\n\n    rafIdRef.current = window.requestAnimationFrame(tick);\n    return () => {\n      if (rafIdRef.current !== null) {\n        window.cancelAnimationFrame(rafIdRef.current);\n        rafIdRef.current = null;\n      }\n    };\n  }, [isOpen, isPlaying, speedMultiplier]);\n\n  // Escape key closes modal cleanly\n  useEffect(() => {\n    if (!isOpen) return;\n    const onKeyDown = (e: KeyboardEvent) => {\n      if (e.key === \"Escape\") onClose();\n    };\n    window.addEventListener(\"keydown\", onKeyDown);\n    return () => window.removeEventListener(\"keydown\", onKeyDown);\n  }, [isOpen, onClose]);\n\n  if (!isOpen) return null;\n\n  const handleReplay = () => {\n    setProgress(0);\n    setIsPlaying(true);\n    lastFrameTimeRef.current = null;\n  };\n\n  const handleJumpToCheckpoint = (targetProgress: number) => {\n    setIsPlaying(false);\n    setProgress(targetProgress);\n  };\n\n  const handleTogglePlay = () => {\n    if (progress >= 0.995) {\n      handleReplay();\n    } else {\n      setIsPlaying((prev) => !prev);\n    }\n  };\n\n  const isCompleted = progress >= 0.96;\n  const pct = Math.round(progress * 100);\n\n  return (\n    <div\n      className=\"fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-2 sm:p-4\"\n      role=\"dialog\"\n      aria-modal=\"true\"\n      aria-label={`M\u00f4 ph\u1ecfng g\u00f3c nh\u00ecn ng\u01b0\u1eddi l\u00e1i t\u1edbi \u00f4 ${slotId}`}\n    >\n      <div className=\"bg-slate-900 border-2 border-slate-700/90 rounded-2xl max-w-5xl w-full overflow-hidden shadow-2xl flex flex-col text-white\">\n        {/* Top Modal Header */}\n        <div className=\"bg-slate-950 px-4 py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2\">\n          <div className=\"flex items-center gap-3\">\n            <span className=\"px-2.5 py-1 rounded-lg bg-amber-400 text-slate-950 font-black text-xs uppercase tracking-wider shadow-xs\">\n              POV \u2022 Sau V\u00f4 L\u0103ng\n            </span>\n            <div>\n              <h3 className=\"text-sm sm:text-base font-extrabold text-white flex items-center gap-2 flex-wrap\">\n                <span>D\u1eabn \u0110\u01b0\u1eddng V\u00e0o \u00d4 \u0110\u1ed7 {slotId}</span>\n                <span className=\"text-xs font-mono bg-blue er Arm */}\n                  <g\n                    transform={`rotate(${-pose.barrierAngleDeg} 234 254)`}\n                  >\n                    <rect\n                      x=\"234\"\n                      y=\"246\"\n                      width=\"326\"\n                      height=\"14\"\n                      rx=\"4\"\n                      fill=\"#ef4444\"\n                      stroke=\"#ffffff\"\n                      strokeWidth=\"2\"\n                    />\n                    <rect x=\"275\" y=\"246\" width=\"35\" height=\"14\" fill=\"#ffffff\" />\n                    <rect x=\"345\" y=\"246\" width=\"35\" height=\"14\" fill=\"#ffffff\" />\n                    <rect x=\"415\" y=\"246\" width=\"35\" height=\"14\" fill=\"#ffffff\" />\n                    <rect x=\"485\" y=\"246\" width=\"35\" height=\"14\" fill=\"#ffffff\" />\n                  </g>\n                </g>\n              )}\n\n              {/* Wheel-stop bumper & Parked confirmation banner in final phase */}\n              {isCompleted && (\n                <g>\n                  <rect\n                    x=\"245\"\n                    y=\"112\"\n                    width=\"310\"\n                    height=\"68\"\n                    rx=\"14\"\n                    fill=\"rgba(6, 78, 59, 0.94)\"\n                    stroke=\"#34d399\"\n                    strokeWidth=\"2.5\"\n                  />\n                  <text\n                    x=\"400\"\n                    y=\"142\"\n                    textAnchor=\"middle\"\n                    fill=\"#a7f3d0\"\n                    fontSize=\"13.5\"\n                    fontWeight=\"bold\"\n                  >\n                    \u2713 \u0110\u00c3 \u0110\u1ed6 XE NGAY NG\u1eaeN TRONG \u00d4 {slotId}\n                  </text>\n                  <text\n                    x=\"400\"\n                    y=\"165\"\n                    textAnchor=\"middle\"\n                    fill=\"#ffffff\"\n                    fontSize=\"14.5\"\n          <div className=\"bg-blue-50 border border-blue-200 rounded-xl p-3.5 text-xs text-slate-700 space-y-2\">\n            <div className=\"font-extrabold text-[#004b87]\">\n              T\u00e0i kho\u1ea3n \u0111\u1ecbnh danh n\u1ed9i b\u1ed9 (Demo Ready)\n            </div>\n            <p className=\"text-[11px] text-slate-600 leading-relaxed\">\n              T\u00e0i kho\u1ea3n, xe \u0111\u1ecbnh danh v\u00e0 m\u1eabu khu\u00f4n m\u1eb7t 512-D \u0111\u01b0\u1ee3c qu\u1ea3n l\u00fd n\u1ed9i b\u1ed9 trong MySQL (kh\u00f4ng m\u1edf \u0111\u0103ng k\u00fd c\u00f4ng khai tr\u00ean web). H\u1ed7 tr\u1ee3 ch\u1ea1y song song <strong>USER</strong> v\u00e0 <strong>ADMIN</strong> tr\u00ean 2 tab/tr\u00ecnh duy\u1ec7t kh\u00e1c nhau.\n            </p>\n            <div className=\"flex items-center gap-2 pt-0.5\">\n              <button\n                type=\"button\"\n                onClick={fillDemoUser}\n                className=\"flex-1 bg-white hover:bg-blue-100 text-[#004b87] border border-blue-300 font-bold py-2 px-2.5 rounded-xl text-xs transition cursor-pointer shadow-2xs\"\n              >\n                \ud83d\udc64 USER (viet_user)\n              </button>\n              <button\n                type=\"button\"\n                onClick={fillDemoAdmin}\n                className=\"flex-1 bg-white hover:bg-amber-50 text-amber-900 border border-amber-300 font-bold py-2 px-2.5 rounded-xl text-xs transition cursor-pointer shadow-2xs\"\n              >\n                \ud83d\udee1\ufe0f ADMIN (admin)\n              </button>\n            </div>\n          </div>\n\n          {errorMessage && (\n            <div\n              role=\"alert\"\n              className=\"bg-rose-50 border-2 border-rose-400 text-rose-900 px-3.5 py-2.5 rounded-xl text-xs font-semibold\"\n            >\n              \u26a0\ufe0f {errorMessage}\n            </div>\n          )}\n\n          <div>\n            <label\n              htmlFor=\"username\"\n              className=\"block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1\"\n            >\n              T\u00ean \u0111\u0103ng nh\u1eadp\n            </label>\n            <input\n              id=\"username\"\n              type=\"text\"\n              value={username}\n              onChange={(e) => setUsername(e.target.value)}\n              required\n              autoComplete=\"username\"\n              className=\"w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#004b87]\"\n              placeholder=\"Nh\u1eadp username (v\u00ed d\u1ee5: viet_user)\"\n            />\n          </div>\n\n          <div>\n            <label\n              htmlFor=\"password\"\n              className=\"block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1\"\n            >\n              M\u1eadt kh\u1ea9u\n            </label>\n            <div className=\"relative\">\n              <input\n                id=\"password\"\n                type={showPassword ? \"text\" : \"password\"}\n                value={password}\n                onChange={(e) => setPassword(e.target.value)}\n                required\n                autoComplete=\"current-password\"\n                className=\"w-full px-3.5 py-2.5 pr-12 rounded-xl border border-slate-300 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#004b87]\"\n                placeholder=\"Nh\u1eadp m\u1eadt kh\u1ea9u\"\n              />\n              <button\n                type=\"button\"\n                onClick={() => setShowPassword((prev) => !prev)}\n                className=\"absolute right-2.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-500 hover:text-slate-800 px-2 py-1 cursor-pointer\"\n                aria-label={showPassword ? \"\u1ea8n m\u1eadt kh\u1ea9u\" : \"Hi\u1ec7n m\u1eadt kh\u1ea9u\"}\n              >\n                {showPassword ? \"\u1ea8n\" : \"Hi\u1ec7n\"}\n              </button>\n            </div>\n          </div>\n\n          <button\n            type=\"submit\"\n            disabled={isLoading}\n            className=\"w-full bg-[#004b87] hover:bg-[#003968] disabled:bg-slate-400 text-white font-extrabold py-3 rounded-xl text-sm shadow-md transition cursor-pointer\"\n          >\n            {isLoading ? \"\u23f3 \u0110ang x\u00e1c th\u1ef1c v\u1edbi MySQL...\" : \"\u0110\u0103ng Nh\u1eadp H\u1ec7 Th\u1ed1ng \u2192\"}\n          </button>\n        </form>\n      </div>\n    </div>\n  );\n};\n\n\n// === FILE: src/features/user-portal/UserBookingPortal.tsx ===\n\n\n\n\n\n\ninterface UserBookingPortalProps {\n  user: UserProfile;\n  onLogout: () => void;\n}\n\nfunction formatCountdownMMSS(totalSeconds: number): string {\n  const clamped = Math.max(0, Math.floor(totalSeconds));\n  const mins = Math.floor(clamped / 60);\n  const secs = clamped % 60;\n  return `${String(mins).padStart(2, \"0\")}:${String(secs).padStart(2, \"0\")}`;\n}\n\nfunction formatVnDateTime(isoStr: string | null | undefined): string {\n  if (!isoStr) return \"\u2014\";\n  try {\n    const dt = new Date(isoStr);\n    if (Number.isNaN(dt.getTime())) return isoStr;\n    return dt.toLocaleString(\"vi-VN\", {\n      timeZone: \"Asia/Ho_Chi_Minh\",\n      hour12: false,\n    });\n  } catch {\n    return isoStr;\n  }\n}\n\nfunction formatDurationMinutes(\n  startIso: string | null | undefined,\n  endIso: string | null | undefined\n): string {\n  if (!startIso || !endIso) return \"\u2014\";\n  const diffMs = Date.parse(endIso) - Date.parse(startIso);\n  if (Number.isNaN(diffMs) || diffMs < 0) return \"\u2014\";\n  const mins = Math.max(1, Math.round(diffMs / 60000));\n  if (mins < 60) return `${mins} ph\u00fat`;\n  const h = Math.floor(mins / 60);\n  const m = mins % 60;\n  return `${h} gi\u1edd ${m} ph\u00fat`;\n}\n\nfunction getBookingStatusBadge(status: string): { label: string; className: string } {\n  switch (status) {\n    case \"Reserved\":\n      return {\n        label: \"\u0110ang gi\u1eef ch\u1ed7 (Reserved)\",\n        className: \"bg-amber-100 text-amber-900 border-amber-300\",\n      };\n    case \"Checkin_pending\":\n      return {\n        label: \"\u0110ang \u0111\u1ed1i so\u00e1t c\u1ed5ng v\u00e0o\",\n        className: \"bg-sky-100 text-sky-900 border-sky-300\",\n      };\n    case \"Checked_in\":\n      return {\n        label: \"\u0110\u00e3 qua c\u1ed5ng v\u00e0o b\u00e3i\",\n        className: \"bg-indigo-100 text-indigo-900 border-indigo-300\",\n      };\n    case \"Completed\":\n      return {\n        label: \"Ho\u00e0n t\u1ea5t l\u01b0\u1ee3t \u0111\u1ed7\",\n        className: \"bg-emerald-100 text-emerald-900 border-emerald-300\",\n      };\n    case \"Expired\":\n      return {\n        label: \"H\u1ebft h\u1ea1n 60 ph\u00fat\",\n        className: \"bg-rose-100 text-rose-900 border-rose-300\",\n      };\n    case \"Cancelled\":\n      return {\n        label: \"\u0110\u00e3 h\u1ee7y \u0111\u1eb7t ch\u1ed7\",\n        className: \"bg-slate-200 text-slate-700 border-slate-300\",\n      };\n    default:\n      return {\n        label: status,\n        className: \"bg-slate-100 text-slate-700 border-slate-300\",\n      };\n  }\n}\n\nfunction getSessionStatusBadge(status: string): { label: string; className: string } {\n  switch (status) {\n    case \"Entry_pending\":\n      return { label: \"Ch\u1edd qua c\u1ed5ng v\u00e0o\", className: \"bg-sky-100 text-sky-900 border-sky-300\" };\n    case \"Active\":\n      return { label: \"\u0110ang g\u1eedi trong b\u00e3i\", className: \"bg-blue-100 text-blue-900 border-blue-300\" };\n    case \"Exit_pending\":\n      return { label: \"\u0110ang l\u00e0m th\u1ee7 t\u1ee5c ra\", className: \"bg-amber-100 text-amber-900 border-amber-300\" };\n    case \"Closed\":\n      return { label: \"\u0110\u00e3 r\u1eddi b\u00e3i (Closed)\", className: \"bg-emerald-100 text-emerald-900 border-emerald-300\" };\n    case \"Cancelled\":\n      return { label: \"\u0110\u00e3 h\u1ee7y phi\u00ean\", className: \"bg-slate-200 text-slate-700 border-slate-300\" };\n    default:\n      return { label: status, className: \"bg-slate-100 text-slate-700 border-slate-300\" };\n  }\n}\nconst UserBookingPortal: React.FC<UserBookingPortalProps> = ({\n  user,\n  onLogout,\n}) => {\n  const [slots, setSlots] = useState<ParkingSlotView[]>([]);\n  const [availableCount, setAvailableCount] = useState<number>(0);\n  const [selectedSlotId, setSelectedSlotId] = useState<SlotId | null>(null);\n  const [currentBooking, setCurrentBooking] = useState<BookingDTO | null>(null);\n  const [historyBookings, setHistoryBookings] = useState<BookingDTO[]>([]);\n  const [historySessions, setHistorySessions] = useState<SessionDTO[]>([]);\n  const [historyStatusFilter, setHistoryStatusFilter] = useState<string>(\"\");\n  const [activeHistoryTab, setActiveHistoryTab] = useState<\"bookings\" | \"sessions\">(\"bookings\");\n\n  // Server time offset: serverTimeMs - Date.now()\n  const serverOffsetMsRef = useRef<number>(0);\n  // Stable per-attempt idempotency key so retries on the same slot do not double-book\n  const bookingAttemptKeyRef = useRef<{ slotId: SlotId; key: string } | null>(null);\n\n  const [lastUpdatedVn, setLastUpdatedVn] = useState<string>(\"\u2014\");\n  const [countdownSeconds, setCountdownSeconds] = useState<number>(0);\n  const [parkedElapsedSeconds, setParkedElapsedSeconds] = useState<number>(0);\n\n  // Loading, Error, Confirmation Modal & Driver Simulation states\n  const [isInitialLoading, setIsInitialLoading] = useState<boolean>(true);\n  const [isRefreshing, setIsRefreshing] = useState<boolean>(false);\n  const [isBookingSubmitting, setIsBookingSubmitting] = useState<boolean>(false);\n  const [isCancelSubmitting, setIsCancelSubmitting] = useState<boolean>(false);\n  const [isCancelConfirmOpen, setIsCancelConfirmOpen] = useState<boolean>(false);\n  const [isDriverModalOpen, setIsDriverModalOpen] = useState<boolean>(false);\n\n  const [apiErrorBanner, setApiErrorBanner] = useState<string | null>(null);\n  const [feedbackBanner, setFeedbackBanner] = useState<{\n    type: \"success\" | \"warning\" | \"error\";\n    text: string;\n  } | null>(null);\n  const [realtimeConnected, setRealtimeConnected] = useState<boolean>(false);\n\n  const primaryVehicle = user.vehicles[0] || null;\n\n  const syncServerTimeOffset = (serverTimeIso?: string) => {\n    if (!serverTimeIso) return;\n    const parsed = Date.parse(serverTimeIso);\n    if (!Number.isNaN(parsed)) {\n      serverOffsetMsRef.current = parsed - Date.now();\n      setLastUpdatedVn(formatVnDateTime(serverTimeIso));\n    }\n  };\n\n  const refreshAllData = useCallback(\n    async (manual = false) => {\n      if (manual) setIsRefreshing(true);\n      try {\n        const [slotsRes, currentRes, historyRes] = await Promise.all([\n          ParkingService.getSlots(),\n          ParkingService.getCurrentBooking(),\n          ParkingService.getMyHistory({\n            bookingStatus: historyStatusFilter || undefined,\n            limit: 50,\n          }),\n        ]);\n\n        syncServerTimeOffset(slotsRes.server_time || currentRes.server_time);\n        setSlots(slotsRes.slots);\n        setAvailableCount(slotsRes.available_count);\n        setCurrentBooking(currentRes.booking);\n        setHistoryBookings(historyRes.bookings);\n        setHistorySessions(historyRes.sessions);\n        setApiErrorBanner(null);\n\n        setSelectedSlotId((prev) => {\n          if (\n            prev &&\n            slotsRes.slots.some((s) => s.slot_id === prev && s.is_bookable)\n          ) {\n            return prev;\n          }\n          const firstBookable = slotsRes.slots.find((s) => s.is_bookable);\n          return firstBookable ? firstBookable.slot_id : null;\n        });\n      } catch (err) {\n        if (err instanceof ApiError) {\n          setApiErrorBanner(`[${err.reasonCode}] ${err.message}`);\n        } else {\n          setApiErrorBanner(\n            \"M\u1ea5t k\u1ebft n\u1ed1i t\u1edbi m\u00e1y ch\u1ee7 FastAPI. Kh\u00f4ng th\u1ec3 t\u1ea3i d\u1eef li\u1ec7u tr\u1ea1ng th\u00e1i \u00f4 \u0111\u1ed7 th\u1ef1c t\u1ebf.\"\n          );\n        }\n      } finally {\n        setIsInitialLoading(false);\n        if (manual) setIsRefreshing(false);\n      }\n    },\n    [historyStatusFilter]\n  );\n\n  useEffect(() => {\n    refreshAllData();\n  }, [refreshAllData]);\n\n  // Realtime WebSocket / SSE listener\n  useEffect(() => {\n    const unsub = ApiClient.subscribeRealtime(\n      () => {\n        refreshAllData();\n      },\n      (connected) => setRealtimeConnected(connected)\n    );\n    return () => unsub();\n  }, [refreshAllData]);\n\n  // Accurate 1-second server-synchronized countdown timer (persists accurately across F5 reload)\n  useEffect(() => {\n    if (!currentBooking || currentBooking.status !== \"Reserved\") {\n      setCountdownSeconds(0);\n      return;\n    }\n\n    const expiresMs = Date.parse(currentBooking.expires_at);\n    if (Number.isNaN(expiresMs)) {\n      setCountdownSeconds(currentBooking.remaining_seconds || 0);\n      return;\n    }\n\n    const computeRemaining = () => {\n      const nowServerMs = Date.now() + serverOffsetMsRef.current;\n      const diffSec = Math.max(0, Math.floor((expiresMs - nowServerMs) / 1000));\n      setCountdownSeconds(diffSec);\n      if (diffSec === 0) {\n        refreshAllData();\n      }\n    };\n\n    computeRemaining();\n    const timer = window.setInterval(computeRemaining, 1000);\n    return () => window.clearInterval(timer);\n  }, [currentBooking, refreshAllData]);\n\n  // Live elapsed timer once the car has entered the parking lot (status === 'Checked_in' & entry_time set)\n  useEffect(() => {\n    if (\n      !currentBooking ||\n      currentBooking.status !== \"Checked_in\" ||\n      !currentBooking.entry_time\n    ) {\n      setParkedElapsedSeconds(0);\n      return;\n    }\n\n    const entryMs = Date.parse(currentBooking.entry_time);\n    if (Number.isNaN(entryMs)) {\n      setParkedElapsedSeconds(0);\n      return;\n    }\n\n    const updateElapsed = () => {\n      const nowServerMs = Date.now() + serverOffsetMsRef.current;\n      setParkedElapsedSeconds(Math.max(0, Math.floor((nowServerMs - entryMs) / 1000)));\n    };\n    updateElapsed();\n    const timer = window.setInterval(updateElapsed, 1000);\n    return () => window.clearInterval(timer);\n  }, [currentBooking]);\n\n  const handleBookSlot = async () => {\n    if (isBookingSubmitting || !selectedSlotId) return;\n    if (!primaryVehicle) {\n      setFeedbackBanner({\n        type: \"error\",\n        text: \"T\u00e0i kho\u1ea3n ch\u01b0a c\u00f3 ph\u01b0\u01a1ng ti\u1ec7n \u0111\u1ecbnh danh ho\u1ea1t \u0111\u1ed9ng \u0111\u1ec3 \u0111\u1eb7t ch\u1ed7.\",\n      });\n      return;\n    }\n\n    setIsBookingSubmitting(true);\n    setFeedbackBanner(null);\n\n    // Reuse stable idempotency key for same slot retry attempt\n    if (\n      !bookingAttemptKeyRef.current ||\n      bookingAttemptKeyRef.current.slotId !== selectedSlotId\n    ) {\n      bookingAttemptKeyRef.current = {\n        slotId: selectedSlotId,\n        key: `book-${user.user_id}-${primaryVehicle.vehicle_id}-${selectedSlotId}-${Date.now()}`,\n      };\n    }\n    const idempotencyKey = bookingAttemptKeyRef.current.key;\n\n    try {\n      const created = await ParkingService.createBooking(\n        primaryVehicle.vehicle_id,\n        selectedSlotId,\n        idempotencyKey\n      );\n      bookingAttemptKeyRef.current = null;\n      syncServerTimeOffset(created.server_time);\n      setCurrentBooking(created);\n      setFeedbackBanner({\n        type: \"success\",\n        text: `\u0110\u1eb7t gi\u1eef \u00f4 ${created.slot_id} th\u00e0nh c\u00f4ng trong 60 ph\u00fat cho xe ${\n          created.plate_display || created.plate_number\n        }! Nh\u1ea5n \"Xem \u0111\u01b0\u1eddng \u0111i\" b\u1ea5t c\u1ee9 l\u00fac n\u00e0o \u0111\u1ec3 xem l\u1ea1i m\u00f4 ph\u1ecfng g\u00f3c nh\u00ecn sau v\u00f4 l\u0103ng.`,\n      });\n      await refreshAllData();\n      setIsDriverModalOpen(true);\n    } catch (err) {\n      if (err instanceof ApiError) {\n        // Clear attempt key on deterministic conflict/4xx so user can pick another slot cleanly\n        if (err.status >= 400 && err.status < 500) {\n          bookingAttemptKeyRef.current = null;\n        }\n        if (err.status === 409) {\n          setFeedbackBanner({\n            type: \"warning\",\n            text: `Xung \u0111\u1ed9t \u0111\u1eb7t ch\u1ed7 (HTTP 409 \u2022 ${err.reasonCode}): ${err.message}`,\n          });\n        } else {\n          setFeedbackBanner({\n            type: \"error\",\n            text: `L\u1ed7i \u0111\u1eb7t ch\u1ed7 (${err.reasonCode}): ${err.message}`,\n          });\n        }\n      } else {\n        setFeedbackBanner({\n          type: \"error\",\n          text: \"L\u1ed7i k\u1ebft n\u1ed1i m\u1ea1ng khi \u0111\u1eb7t ch\u1ed7. B\u1ea1n c\u00f3 th\u1ec3 b\u1ea5m l\u1ea1i \u0111\u1ec3 th\u1eed an to\u00e0n (\u0111\u00e3 b\u1ea3o v\u1ec7 ch\u1ed1ng \u0111\u1eb7t tr\u00f9ng).\",\n        });\n      }\n      await refreshAllData();\n    } finally {\n      setIsBookingSubmitting(false);\n    }\n  };\n\n  const handleConfirmCancelBooking = async () => {\n    if (!currentBooking || isCancelSubmitting) return;\n    setIsCancelSubmitting(true);\n    setFeedbackBanner(null);\n    try {\n      const cancelled = await ParkingService.cancelBooking(\n        currentBooking.booking_id\n      );\n      setIsCancelConfirmOpen(false);\n      syncServerTimeOffset(cancelled.server_time);\n      setFeedbackBanner({\n        type: \"warning\",\n        text: `\u0110\u00e3 h\u1ee7y \u0111\u1eb7t gi\u1eef \u00f4 ${cancelled.slot_id} th\u00e0nh c\u00f4ng. \u00d4 \u0111\u1ed7 \u0111\u00e3 \u0111\u01b0\u1ee3c m\u1edf l\u1ea1i cho h\u1ec7 th\u1ed1ng.`,\n      });\n      await refreshAllData();\n    } catch (err) {\n      setIsCancelConfirmOpen(false);\n      if (err instanceof ApiError) {\n        setFeedbackBanner({\n          type: \"error\",\n          text: `Kh\u00f4ng th\u1ec3 h\u1ee7y \u0111\u1eb7t ch\u1ed7 (${err.reasonCode}): ${err.message}`,\n        });\n      } else {\n        setFeedbackBanner({\n          type: \"error\",\n          text: \"L\u1ed7i k\u1ebft n\u1ed1i m\u1ea1ng khi h\u1ee7y \u0111\u1eb7t ch\u1ed7.\",\n        });\n      }\n      await refreshAllData();\n    } finally {\n      setIsCancelSubmitting(false);\n    }\n  };\n\n  const getSlotById = (id: SlotId): ParkingSlotView | undefined =>\n    slots.find((s) => s.slot_id === id);\n\n  const getSlotVisualStyle = (\n    displayStatus: DisplaySlotStatus,\n    isSelected: boolean,\n    isMyBooking: boolean,\n    isMySession: boolean\n  ) => {\n    switch (displayStatus) {\n      case \"AVAILABLE\":\n        return {\n          cardClass: isSelected\n            ? \"border-emerald-600 ring-4 ring-emerald-200 bg-emerald-50 shadow-md scale-[1.01]\"\n            : \"border-emerald-400 bg-white hover:border-emerald-600 hover:bg-emerald-50/60\",\n          badgeClass: \"bg-emerald-600 text-white\",\n          icon: \"\ud83d\udfe2\",\n          hint: isSelected ? \"\u2713 \u0110ang ch\u1ecdn \u0111\u1eb7t \u00f4 n\u00e0y\" : \"B\u1ea5m ch\u1ecdn \u0111\u1ec3 \u0111\u1eb7t 60 ph\u00fat\",\n        };\n      case \"RESERVED\":\n        return {\n          cardClass: isMyBooking\n            ? \"border-amber-500 ring-2 ring-amber-200 bg-amber-50 shadow-sm\"\n            : \"border-amber-300 bg-amber-50/40 opacity-90\",\n          badgeClass: \"bg-amber-500 text-slate-950\",\n          icon: \"\u23f3\",\n          hint: isMyBooking ? \"\u00d4 b\u1ea1n \u0111ang \u0111\u1eb7t gi\u1eef\" : \"\u0110\u00e3 c\u00f3 ng\u01b0\u1eddi \u0111\u1eb7t tr\u01b0\u1edbc\",\n        };\n      case \"ASSIGNED_PENDING\":\n        return {\n          cardClass: isMySession\n            ? \"border-sky-500 ring-2 ring-sky-200 bg-sky-50 shadow-sm\"\n            : \"border-sky-400 bg-sky-50/50 opacity-90\",\n          badgeClass: \"bg-sky-600 text-white\",\n          icon: \"\ud83d\ude97\",\n          hint: isMySession\n            ? \"\u0110ang ch\u1edd xe c\u1ee7a b\u1ea1n ti\u1ebfn v\u00e0o \u00f4\"\n            : \"\u0110ang c\u1ea5p cho xe qua c\u1ed5ng\",\n        };\n      case \"OCCUPIED\":\n        return {\n          cardClass: isMySession\n            ? \"border-[#004b87] ring-2 ring-blue-300 bg-blue-50 shadow-sm\"\n            : \"border-[#004b87] bg-blue-50/50 opacity-90\",\n          badgeClass: \"bg-[#004b87] text-white\",\n          icon: \"\ud83d\ude99\",\n          hint: isMySession\n            ? \"\u2713 Xe c\u1ee7a b\u1ea1n \u0111ang \u0111\u1ed7 trong \u00f4 n\u00e0y\"\n            : \"\u0110ang c\u00f3 xe \u0111\u1ed7 trong \u00f4\",\n        };\n      case \"UNKNOWN_OR_FAULT\":\n      default:\n        return {\n          cardClass: \"border-rose-400 bg-rose-50/60 opacity-90\",\n          badgeClass: \"bg-rose-600 text-white\",\n          icon: \"\u26a0\ufe0f\",\n          hint: \"C\u1ea3m bi\u1ebfn qu\u00e1 h\u1ea1n / L\u1ed7i d\u1eef li\u1ec7u\",\n        };\n    }\n  };\n\n  const highlightedSlotId: SlotId | null =\n    currentBooking?.slot_id || selectedSlotId || null;\n\n  const renderFloorPlanSlotCard = (slotId: SlotId) => {\n    const slot = getSlotById(slotId);\n    if (!slot) {\n      return (\n        <div\n          key={slotId}\n          className=\"border-2 border-dashed border-rose-300 bg-rose-50/40 rounded-2xl p-4 min-h-[155px] flex flex-col items-center justify-center text-xs text-rose-700 font-bold\"\n        >\n          <span>\u26a0\ufe0f \u00d4 {slotId}</span>\n          <span className=\"text-[11px] font-medium mt-1\">\n            Ch\u01b0a \u0111\u1ee7 d\u1eef li\u1ec7u c\u1ea3m bi\u1ebfn\n          </span>\n        </div>\n      );\n    }\n\n    const isSelected = !currentBooking && selectedSlotId === slot.slot_id;\n    const style = getSlotVisualStyle(\n      slot.display_status,\n      isSelected,\n      slot.is_my_booking,\n      slot.is_my_session\n    );\n    const canSelect = slot.is_bookable && !currentBooking;\n    const isMine = slot.is_my_booking || slot.is_my_session;\n\n    return (\n      <button\n        key={slot.slot_id}\n        type=\"button\"\n        disabled={!canSelect && !isMine}\n        onClick={() => {\n          if (canSelect) {\n            setSelectedSlotId(slot.slot_id);\n          }\n        }}\n        className={`w-full text-left border-2 rounded-2xl p-3.5 sm:p-4 flex flex-col justify-between min-h-[164px] transition-all ${\n          style.cardClass\n        } ${canSelect ? \"cursor-pointer\" : \"cursor-default\"}`}\n      >\n        {/* Top Row: Slot ID + Status Badge */}\n        <div className=\"flex items-start justify-between gap-2\">\n          <div>\n            <div className=\"flex items-center gap-2\">\n              <span className=\"text-2xl font-black text-slate-900 leading-none\">\n                {slot.slot_id}\n              </span>\n              <span className=\"text-lg\">{style.icon}</span>\n            </div>\n            <div className=\"text-[11px] text-slate-500 font-mono mt-1\">\n              {slot.sensor_id} \u2022 IR: {slot.physical_status}\n            </div>\n          </div>\n          <span\n            className={`text-[11px] font-extrabold px-2.5 py-1 rounded-lg shadow-2xs text-right leading-tight ${style.badgeClass}`}\n          >\n            {slot.label_vi}\n          </span>\n        </div>\n\n        {/* Middle Info: Own Vehicle Plate or Route Summary */}\n        <div className=\"my-2.5\">\n          {isMine && slot.plate_display ? (\n            <div\n              className={`inline-flex items-center gap-1.5 font-mono text-xs font-black px-2.5 py-1 rounded-lg border ${\n                slot.is_my_session\n                  ? \"bg-blue-100 text-blue-950 border-blue-400\"\n                  : \"bg-amber-200/90 text-slate-950 border-amber-400\"\n              }`}\n            >\n              <span>{slot.is_my_session ? \"\ud83d\ude99\" : \"\ud83d\ude98\"}</span>\n              <span>\n                {slot.is_my_session ? \"\u0110ang \u0111\u1ed7:\" : \"Xe c\u1ee7a b\u1ea1n:\"} {slot.plate_display}\n              </span>\n            </div>\n          ) : isSelected ? (\n            <div className=\"text-[11px] font-bold text-emerald-800 bg-emerald-100/90 px-2.5 py-1 rounded-lg border border-emerald-300\">\n              {DRIVER_ROUTES[slot.slot_id].turnLabelVi}\n            </div>\n          ) : (\n            <div className=\"text-[11px] text-slate-500 font-medium\">\n              {DRIVER_ROUTES[slot.slot_id].zoneLabel}\n            </div>\n          )}\n        </div>\n\n        {/* Bottom Hint */}\n        <div className=\"pt-2 border-t border-slate-200/70 flex items-center justify-between text-[11px]\">\n          <span className=\"font-bold text-slate-700\">{style.hint}</span>\n          {canSelect && (\n            <span\n              className={`text-[11px] font-extrabold ${\n                isSelected ? \"text-emerald-700\" : \"text-[#004b87]\"\n              }`}\n            >\n              {isSelected ? \"\u0110\u00e3 ch\u1ecdn\" : \"Ch\u1ecdn \u2192\"}\n            </span>\n          )}\n        </div>\n      </button>\n    );\n  };\n\n  // Countdown urgency styling\n  const countdownPct = Math.min(100, Math.max(0, (countdownSeconds / 3600) * 100));\n  const countdownColorClass =\n    countdownSeconds <= 300\n      ? \"text-rose-400 border-rose-500/70\"\n      : countdownSeconds <= 900\n      ? \"text-amber-300 border-amber-400/70\"\n      : \"text-emerald-300 border-emerald-400/60\";\n  const countdownBarClass =\n    countdownSeconds <= 300\n      ? \"bg-rose-500\"\n      : countdownSeconds <= 900\n      ? \"bg-amber-400\"\n      : \"bg-emerald-400\";\n\n  const bookingStepIndex = !currentBooking\n    ? -1\n    : currentBooking.status === \"Reserved\"\n    ? 0\n    : currentBooking.status === \"Checkin_pending\"\n    ? 1\n    : currentBooking.status === \"Checked_in\"\n    ? 2\n    : 3;\n\n  return (\n    <div className=\"min-h-screen flex flex-col bg-slate-100 text-slate-800\">\n      {/* Top Institutional & Driver Identity Header */}\n      <header className=\"bg-gradient-to-r from-[#002f57] via-[#004b87] to-[#003366] text-white shadow-lg sticky top-0 z-30 border-b border-blue-950\">\n        <div className=\"max-w-6xl mx-auto px-4 py-3 flex flex-col lg:flex-row lg:items-center justify-between gap-3\">\n          <div className=\"flex items-center gap-3\">\n            <div className=\"w-11 h-11 rounded-xl bg-amber-400 text-slate-950 font-black flex flex-col items-center justify-center shadow-md flex-shrink-0\">\n              <span className=\"text-sm leading-none\">PBL4</span>\n              <span className=\"text-[8px] font-bold mt-0.5\">USER</span>\n            </div>\n            <div>\n              <div className=\"text-[11px] text-amber-300 font-bold uppercase tracking-wider\">\n                H\u1ec7 Th\u1ed1ng B\u00e3i \u0110\u1ed7 Xe Th\u00f4ng Minh IoT \u2022 C\u1ed5ng Ng\u01b0\u1eddi D\u00f9ng\n              </div>\n              <h1 className=\"text-base sm:text-lg font-extrabold tracking-tight\">\n                \u0110\u1eb7t Gi\u1eef \u00d4 \u0110\u1ed7 60 Ph\u00fat &amp; D\u1eabn \u0110\u01b0\u1eddng G\u00f3c Nh\u00ecn Ng\u01b0\u1eddi L\u00e1i\n              </h1>\n            </div>\n          </div>\n\n          {/* Registered Driver, Vehicle & Encrypted Face Template Badges */}\n          <div className=\"flex flex-wrap items-center gap-2\">\n            <div className=\"bg-white/10 backdrop-blur-xs border border-white/15 rounded-xl px-3 py-1.5 text-xs\">\n              <div className=\"text-[10px] text-blue-200 uppercase font-bold\">\n                Ch\u1ee7 xe ({user.username})\n              </div>\n              <div className=\"font-bold text-white\">{user.display_name}</div>\n            </div>\n\n            <div className=\"bg-white/10 backdrop-blur-xs border border-white/15 rounded-xl px-3 py-1.5 text-xs\">\n              <div className=\"text-[10px] text-blue-200 uppercase font-bold\">\n                Xe \u0111\u1ecbnh danh c\u00f3 s\u1eb5n\n              </div>\n              <div className=\"font-mono font-black text-amber-300\">\n                {primaryVehicle\n                  ? `${primaryVehicle.plate_display} (${primaryVehicle.plate_number})`\n                  : \"Ch\u01b0a g\u00e1n xe\"}\n              </div>\n            </div>\n\n            <div className=\"bg-white/10 backdrop-blur-xs border border-white/15 rounded-xl px-3 py-1.5 text-xs\">\n              <div className=\"text-[10px] text-blue-200 uppercase font-bold\">\n                M\u1eabu khu\u00f4n m\u1eb7t 512-D\n              </div>\n              <div className=\"font-bold flex items-center gap-1.5\">\n                <span\n                  className={`w-2 h-2 rounded-full ${\n                    user.face_template.has_active_template\n                      ? \"bg-emerald-400\"\n                      : \"bg-rose-400\"\n                  }`}\n                />\n                <span\n                  className={\n                    user.face_template.has_active_template\n                      ? \"text-emerald-300\"\n                      : \"text-rose-300\"\n                  }\n                >\n                  {user.face_template.has_active_template\n                    ? `\u0110\u00e3 li\u00ean k\u1ebft (${user.face_template.model_id || \"buffalo_l\"})`\n                    : \"Ch\u01b0a c\u00f3 m\u1eabu\"}\n                </span>\n              </div>\n            </div>\n\n            <button\n              type=\"button\"\n              onClick={onLogout}\n              className=\"bg-rose-600 hover:bg-rose-500 text-white font-bold px-3.5 py-2.5 rounded-xl text-xs transition cursor-pointer shadow\"\n            >\n              \u0110\u0103ng xu\u1ea5t\n            </button>\n          </div>\n        </div>\n      </header>\n\n      <main className=\"max-w-6xl mx-auto px-4 py-6 flex-1 w-full ex flex-wrap gap-x-5 gap-y-1\">\n                  <span>\n                    V\u1ecb tr\u00ed:{\" \"}\n                    <strong className=\"text-white\">\n                      {DRIVER_ROUTES[currentBooking.slot_id].zoneLabel}\n                    </strong>\n                  </span>\n                  {currentBooking.status === \"Checked_in\" && currentBooking.entry_time ? (\n                    <>\n                      <span>\n                        Gi\u1edd qua c\u1ed5ng v\u00e0o:{\" \"}\n                        <strong className=\"text-emerald-300\">\n                          {formatVnDateTime(currentBooking.entry_time)}\n                        </strong>\n                      </span>\n                      <span>\n                        Tr\u1ea1ng th\u00e1i c\u1ea3m bi\u1ebfn \u0111\u1ed7:{\" \"}\n                        <strong className=\"text-white\">\n                          {currentBooking.parking_status === \"Parked_confirmed\"\n                            ? \"\u0110\u00e3 x\u00e1c nh\u1eadn \u0111\u1ed7 \u0111\u00fang \u00f4\"\n                            : currentBooking.parking_status}\n                        </strong>\n                      </span>\n                    </>\n                  ) : (\n                    <>\n                      <span>\n                        Gi\u1edd \u0111\u1eb7t:{\" \"}\n                        <strong>{formatVnDateTime(currentBooking.created_at)}</strong>\n                      </span>\n                      <span>\n                        H\u1ebft h\u1ea1n:{\" \"}\n                        <strong className=\"text-amber-300\">\n                          {formatVnDateTime(currentBooking.expires_at)}\n                        </strong>\n                      </span>\n                    </>\n                  )}\n                </div>\n              </div>\n\n              {/* Countdown Timer (Reserved) OR Live Parked Elapsed Timer (Checked_in) + Actions */}\n              <div className=\"flex flex-col sm:flex-row items-stretch sm:items-center gap-3\">\n                {currentBooking.status === \"Reserved\" && (\n                  <div\n                    className={`bg-slate-950/90 border-2 rounded-2xl px-4 py-2.5 min-w-[165px] text-center ${countdownColorClass}`}\n                  >\n                    <div className=\"text-[10px] uppercase tracking-wider text-slate-300 font-bold\">\n                      Gi\u1eef \u00f4 c\u00f2n l\u1ea1i (Server)\n                    </div>\n                    <div\n                      data-testid=\"booking-countdown\"\n                      className=\"text-3xl font-black font-mono tracking-wider leading-tight mt-0.5\"\n                    >\n                      {formatCountdownMMSS(countdownSeconds)}\n                    </div>\n                    <div className=\"w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mt-1.5\">\n                      <div\n                        className={`h-full transition-all duration-500 ${countdownBarClass}`}\n                        style={{ width: `${countdownPct}%` }}\n                      />\n                    </div>\n                  </div>\n                )}\n\n                {currentBooking.status === \"Checked_in\" && (\n                  <div className=\"bg-slate-950/90 border-2 border-emerald-400/70 rounded-2xl px-4 py-2.5 min-w-[165px] text-center text-emerald-300\">\n                    <div className=\"text-[10px] uppercase tracking-wider text-slate-300 font-bold\">\n                      Th\u1eddi gian \u0111ang g\u1eedi xe\n                    </div>\n                    <div className=\"text-3xl font-black font-mono tracking-wider leading-tight mt-0.5\">\n                      {formatCountdownMMSS(parkedElapsedSeconds)}\n                    </div>\n                    <div className=\"text-[10px] font-bold text-emerald-400 mt-1\">\n                      {currentBooking.parking_status === \"Parked_confirmed\"\n                        ? \"\u25cf \u0110\u00e3 \u0111\u1ed7 \u1ed5n \u0111\u1ecbnh\"\n                        : \"\u25cf \u0110ang di chuy\u1ec3n v\u00e0o \u00f4\"}\n                    </div>\n                  </div>\n                )}\n\n                <div className=\"flex flex-col sm:flex-row gap-2\">\n                  <button\n                    type=\"button\"\n                    onClick={() => setIsDriverModalOpen(true)}\n                    className=\"bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold px-4 py-3 rounded-xl text-xs transition cursor-pointer shadow-lg flex items-center justify-center gap-1.5\"\n                  >\n                    <span>\ud83d\ude98</span>\n                    <span>Xem \u0111\u01b0\u1eddng \u0111i (G\u00f3c nh\u00ecn ng\u01b0\u1eddi l\u00e1i)</span>\n                  </button>\n\n                  <button\n                    type=\"button\"\n                    onClick={() => setIsCancelConfirmOpen(true)}\n                    disabled={!currentBooking.can_cancel || isCancelSubmitting}\n                    title={\n                      currentBooking.can_cancel\n                        ? \"H\u1ee7y gi\u1eef ch\u1ed7 \u00f4 \u0111\u1ed7 n\u00e0y\"\n                        : \"Kh\u00f4ng th\u1ec3 h\u1ee7y khi xe \u0111\u00e3 b\u1eaft \u0111\u1ea7u \u0111\u1ed1i so\u00e1t t\u1ea1i c\u1ed5ng v\u00e0o\"\n                    }\n                    className=\"bg-rose-600 hover:bg-rose-500 disabled:bg-slate-600 disabled:text-slate-300 disabled:cursor-not-allowed text-white font-bold px-4 py-3 rounded-xl text-xs transition cursor-pointer shadow\"\n                  >\n                    \u2715 H\u1ee7y \u0111\u1eb7t ch\u1ed7\n                  </button>\n                </div>\n              </div>\n            </div>\n\n            {/* 4-Step Booking Lifecycle Stepper */}\n            <div className=\"pt-3 border-t border-white/15 grid grid-cols-2 sm:grid-cols-4 gap-2 text-[11px]\">\n              {[\n                { idx: 0, label: \"1. \u0110\u00e3 gi\u1eef ch\u1ed7 60 ph\u00fat\" },\n                { idx: 1, label: \"2. \u0110\u1ed1i so\u00e1t c\u1ed5ng v\u00e0o\" },\n                { idx: 2, label: \"3. \u0110\u00e3 v\u00e0o b\u00e3i \u0111\u1ed7\" },\n                { idx: 3, label: \"4. R\u1eddi b\u00e3i ho\u00e0n t\u1ea5t\" },\n              ].map((step) => {\n                const isDone = bookingStepIndex > step.idx;\n                const isCurrent = bookingStepIndex === step.idx;\n                return (\n                  <div\n                    key={step.idx}\n                    className={`rounded-xl px-3 py-1.5 font-bold flex items-center gap-1.5 border ${\n                      isCurrent\n                        ? \"bg-amber-400/20 border-amber-400 text-amber-200\"\n                        : isDone\n                        ? \"bg-emerald-500/20 border-emerald-400/60 text-emerald-200\"\n                        : \"bg-slate-950/40 border-white/10 text-slate-400\"\n                    }`}\n                  >\n                    <span>{isDone ? \"\u2713\" : isCurrent ? \"\u25cf\" : \"\u25cb\"}</span>\n                    <span>{step.label}</span>\n                  </div>\n                );\n              })}\n            </div>\n          </section>\n        )}\n\n        {/* Interactive 2D Parking Lot Floor Plan (A1, A2, B1, B2) */}\n        <section className=\"bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-5\">\n          <div className=\"flex flex-col md:flex-row md:items-center justify-between gap-3 pb-4 border-b border-slate-100\">\n            <div>\n              <h2 className=\"text-base sm:text-lg font-extrabold text-[#004b87] uppercase\">\n                S\u01a1 \u0110\u1ed3 M\u1eb7t B\u1eb1ng B\u00e3i \u0110\u1ed7 Xe (4 \u00d4: A1, A2, B1, B2)\n              </h2>\n              <p className=\"text-xs text-slate-500 mt-0.5\">\n                Ch\u1ecdn tr\u1ef1c ti\u1ebfp 1 \u00f4 \u0111ang \u1edf tr\u1ea1ng th\u00e1i{\" \"}\n                <strong className=\"text-emerald-700\">C\u00f3 th\u1ec3 \u0111\u1eb7t / Nh\u1eadn xe</strong>{\" \"}\n                tr\u00ean m\u1eb7t b\u1eb1ng \u0111\u1ec3 gi\u1eef ch\u1ed7 60 ph\u00fat theo gi\u1edd m\u00e1y ch\u1ee7.\n              </p>\n            </div>\n\n            <div className=\"flex flex-wrap items-center gap-2 text-xs\">\n              <div className=\"bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl font-bold text-emerald-900\">\n                Kh\u1ea3 d\u1ee5ng:{\" \"}\n                <span className=\"text-base font-black text-emerald-700\">\n                  {availableCount}\n                </span>{\" \"}\n                / 4 \u00f4\n              </div>\n              <div className=\"bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl text-slate-600 font-medium\">\n                C\u1eadp nh\u1eadt: <strong>{lastUpdatedVn}</strong>\n              </div>\n              <button\n                type=\"button\"\n                onClick={() => refreshAllData(true)}\n                disabled={isRefreshing}\n                className=\"bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-xl border border-slate-300 transition cursor-pointer\"\n              >\n                {isRefreshing ? \"\u23f3 \u0110ang t\u1ea3i...\" : \"\ud83d\udd04 L\u00e0m m\u1edbi\"}\n              </button>\n              <span className=\"inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-900 text-white text-[11px] font-bold\">\n                <span\n                  className={`w-2 h-2 rounded-full ${\n                    realtimeConnected\n                      ? \"bg-emerald-400 animate-pulse\"\n                      : \"bg-amber-400\"\n                  }`}\n                />\n                {realtimeConnected ? \"Realtime Live\" : \"\u0110\u1ed3ng b\u1ed9 \u0111\u1ecbnh k\u1ef3\"}\n              </span>\n            </div>\n          </div>\n\n          {/* Color & Vietnamese Label Legend */}\n          <div c ursor-pointer shadow-md whitespace-nowrap\"\n            >\n              {isBookingSubmitting\n                ? \"\u23f3 \u0110ang x\u1eed l\u00fd giao d\u1ecbch \u0111\u1eb7t \u00f4...\"\n                : selectedSlotId\n                ? `\ud83c\udd7f\ufe0f \u0110\u1eb7t gi\u1eef \u00f4 ${selectedSlotId} (60 ph\u00fat)`\n                : \"Ch\u1ecdn \u00f4 kh\u1ea3 d\u1ee5ng \u0111\u1ec3 \u0111\u1eb7t\"}\n            </button>\n          </div>\n        </section>\n\n        {/* Tabbed Personal History Section */}\n        <section className=\"bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4\">\n          <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100\">\n            <div className=\"flex items-center gap-2 flex-wrap\">\n              <button\n                type=\"button\"\n                onClick={() => setActiveHistoryTab(\"bookings\")}\n                className={`px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer ${\n                  activeHistoryTab === \"bookings\"\n                    ? \"bg-[#004b87] text-white shadow-xs\"\n                    : \"bg-slate-100 text-slate-600 hover:bg-slate-200\"\n                }`}\n              >\n                \ud83d\udcc5 L\u1ecbch s\u1eed \u0110\u1eb7t gi\u1eef \u00f4 ({historyBookings.length})\n              </button>\n              <button\n                type=\"button\"\n                onClick={() => setActiveHistoryTab(\"sessions\")}\n                className={`px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer ${\n                  activeHistoryTab === \"sessions\"\n                    ? \"bg-[#004b87] text-white shadow-xs\"\n                    : \"bg-slate-100 text-slate-600 hover:bg-slate-200\"\n                }`}\n              >\n                \ud83d\ude97 L\u1ecbch s\u1eed Phi\u00ean g\u1eedi xe ({historySessions.length})\n              </button>\n            </div>\n\n
