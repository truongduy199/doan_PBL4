  <script>
    (function() {
      try {
        var rawTsx = "\nconst { useState, useEffect, useCallback, useRef, createContext, useContext } = React;\n\nconst RouterContext = createContext({\n  path: window.location.pathname || \"/login\",\n  navigate: (_to: string, _opts?: { replace?: boolean }) => {},\n});\n\nconst BrowserRouter: React.FC<{ children: React.ReactNode }> = ({ children }) => {\n  const [path, setPath] = useState<string>(\n    window.location.pathname === \"/\" || !window.location.pathname\n      ? \"/login\"\n      : window.location.pathname\n  );\n\n  useEffect(() => {\n    const onPop = () => setPath(window.location.pathname || \"/login\");\n    window.addEventListener(\"popstate\", onPop);\n    return () => window.removeEventListener(\"popstate\", onPop);\n  }, []);\n\n  const navigate = useCallback((to: string, opts?: { replace?: boolean }) => {\n    try {\n      if (opts && opts.replace) {\n        window.history.replaceState({}, \"\", to);\n      } else {\n        window.history.pushState({}, \"\", to);\n      }\n    } catch {\n      // ignore file:// history pushState error\n    }\n    setPath(to);\n  }, []);\n\n  return (\n    <RouterContext.Provider value={{ path, navigate }}>\n      {children}\n    </RouterContext.Provider>\n  );\n};\n\nconst useNavigate = () => useContext(RouterContext).navigate;\n\nconst Navigate: React.FC<{ to: string; replace?: boolean }> = ({ to, replace }) => {\n  const { navigate } = useContext(RouterContext);\n  useEffect(() => {\n    navigate(to, { replace });\n  }, [to, replace, navigate]);\n  return null;\n};\n\nconst Route: React.FC<{ path: string; element: React.ReactNode }> = ({ element }) => <>{element}</>;\n\nconst Routes: React.FC<{ children: React.ReactNode }> = ({ children }) => {\n  const { path } = useContext(RouterContext);\n  const list = React.Children.toArray(children) as React.ReactElement[];\n  for (const child of list) {\n    if (child && child.props && child.props.path === path) {\n      return <>{child.props.element}</>;\n    }\n  }\n  const wildcard = list.find((c) => c && c.props && c.props.path === \"*\");\n  return wildcard ? <>{wildcard.props.element}</> : null;\n};\n\n\n// === FILE: src/shared/types/index.ts ===\ntype SlotId = \"A1\" | \"A2\" | \"B1\" | \"B2\";\ntype PhysicalSlotStatus = \"Free\" | \"Occupied\" | \"Unknown\" | \"Fault\";\ntype DisplaySlotStatus =\n  | \"AVAILABLE\"\n  | \"RESERVED\"\n  | \"ASSIGNED_PENDING\"\n  | \"OCCUPIED\"\n  | \"UNKNOWN_OR_FAULT\";\ntype BookingStatus =\n  | \"Reserved\"\n  | \"Checkin_pending\"\n  | \"Checked_in\"\n  | \"Completed\"\n  | \"Expired\"\n  | \"Cancelled\";\ntype SessionStatus =\n  | \"Entry_pending\"\n  | \"Active\"\n  | \"Exit_pending\"\n  | \"Closed\"\n  | \"Cancelled\";\ntype ParkingStatus =\n  | \"Not_arrived\"\n  | \"Parking_pending\"\n  | \"Parked_confirmed\"\n  | \"Parking_review_required\"\n  | \"Parking_timeout\";\ninterface UserVehicle {\n  vehicle_id: number;\n  plate_number: string;\n  plate_display: string;\n  status: \"Active\" | \"Disabled\";\n}\ninterface UserFaceTemplateInfo {\n  has_active_template: boolean;\n  template_id: number | null;\n  model_id: string | null;\n  model_version: string | null;\n  liveness_status: string | null;\n  status: string | null;\n  updated_at: string | null;\n  updated_at_vn: string | null;\n}\ninterface UserProfile {\n  user_id: number;\n  username: string;\n  display_name: string;\n  role: \"user\" | \"admin\";\n  status: \"Active\" | \"Disabled\";\n  vehicles: UserVehicle[];\n  face_template: UserFaceTemplateInfo;\n  server_time?: string;\n}\ninterface ParkingSlotView {\n  slot_id: SlotId;\n  sensor_id: string;\n  physical_status: PhysicalSlotStatus;\n  display_status: DisplaySlotStatus;\n  label_vi: string;\n  is_available: boolean;\n  is_bookable: boolean;\n  sensor_fresh: boolean;\n  is_my_booking: boolean;\n  is_my_session: boolean;\n  booking_id: string | null;\n  booking_status: BookingStatus | null;\n  expires_at: string | null;\n  expires_at_vn: string | null;\n  remaining_seconds: number | null;\n  plate_number: string | null;\n  plate_display: string | null;\n  updated_at: string | null;\n  updated_at_vn: string | null;\n  last_seen_at: string | null;\n  last_seen_at_vn: string | null;\n  // Admin-only fields\n  active_booking_id?: string | null;\n  reserved_session_id?: string | null;\n  session_status?: SessionStatus | null;\n  parking_status?: ParkingStatus | null;\n  entry_time?: string | null;\n  entry_time_vn?: string | null;\n  booked_by_user_id?: number | null;\n  booked_by_username?: string | null;\n  booked_by_display_name?: string | null;\n  last_boot_id?: string | null;\n  last_sequence?: number | null;\n}\ninterface SlotsResponse {\n  slots: ParkingSlotView[];\n  available_count: number;\n  total_count: number;\n  slot_stale_seconds: number;\n  server_time: string;\n  server_time_vn: string;\n}\ninterface BookingDTO {\n  booking_id: string;\n  user_id: number;\n  vehicle_id: number;\n  plate_number: string | null;\n  plate_display: string | null;\n  slot_id: SlotId;\n  status: BookingStatus;\n  created_at: string;\n  created_at_vn: string;\n  expires_at: string;\n  expires_at_vn: string;\n  checkin_started_at: string | null;\n  checked_in_at: string | null;\n  completed_at: string | null;\n  cancelled_at: string | null;\n  checkin_event_id: string | null;\n  remaining_seconds: number;\n  can_cancel: boolean;\n  server_time: string;\n  server_time_vn: string;\n  username?: string;\n  display_name?: string;\n}\ninterface SessionDTO {\n  session_id: string;\n  plate_number: string;\n  plate_display: string;\n  user_id?: number | null;\n  username?: string | null;\n  display_name?: string | null;\n  vehicle_id?: number | null;\n  booking_id: string | null;\n  booking_status?: BookingStatus | null;\n  booking_expires_at?: string | null;\n  booking_expires_at_vn?: string | null;\n  booking_remaining_seconds?: number;\n  assigned_slot_id: SlotId;\n  status: SessionStatus;\n  parking_status: ParkingStatus;\n  ocr_confidence: number | null;\n  entry_time: string | null;\n  entry_time_vn: string | null;\n  exit_time: string | null;\n  exit_time_vn: string | null;\n  created_at: string | null;\n  created_at_vn: string | null;\n}\ninterface ManualReviewItem {\n  review_type: \"GATE_EVENT\" | \"PARKING_ANOMALY\";\n  event_id: string;\n  gate_id: \"IN\" | \"OUT\";\n  device_id: string;\n  session_id: string | null;\n  booking_id: string | null;\n  plate_number: string | null;\n  plate_display: string | null;\n  slot_id: SlotId | null;\n  decision: \"Pending\" | \"Approved\" | \"Denied\" | \"Review_required\";\n  passage_status: string;\n  reason_code: string | null;\n  liveness_status: string | null;\n  liveness_score: number | null;\n  reviewer_id: number | null;\n  reviewer_username: string | null;\n  review_reason: string | null;\n  created_at: string | null;\n  created_at_vn: string | null;\n  decided_at: string | null;\n}\ninterface DeviceSensorHealth {\n  slot_id: SlotId;\n  sensor_id: string;\n  physical_status: PhysicalSlotStatus;\n  is_fresh: boolean;\n  is_fault: boolean;\n  age_seconds: number | null;\n  stale_threshold_seconds: number;\n  last_boot_id: string | null;\n  last_sequence: number | null;\n  last_seen_at: string | null;\n  last_seen_at_vn: string | null;\n}\ninterface RealtimeEnvelope {\n  event_type: string;\n  server_time: string;\n  server_time_vn?: string;\n  payload: Record<string, unknown>;\n}\n\n// Legacy type aliases kept so any auxiliary subcomponents compile cleanly\ntype SlotStatus = \"FREE\" | \"ASSIGNED\" | \"OCCUPIED\" | \"WRONG_VEHICLE\" | \"FAULT\";\ninterface ParkingSlot {\n  slot_id: SlotId;\n  status: SlotStatus;\n  assigned_session_id?: string | null;\n  current_plate?: string | null;\n  entry_time?: string | null;\n  updated_at: string;\n}\ninterface ParkingSession {\n  session_id: string;\n  plate_number: string;\n  slot_id: SlotId;\n  status: \"ACTIVE\" | \"COMPLETED\" | \"REJECTED\" | \"REVIEW_REQUIRED\";\n  entry_time: string;\n  exit_time?: string | null;\n}\ninterface ReviewRequest {\n  request_id: string;\n  session_id: string;\n  plate_number: string;\n  reason_code: string;\n  similarity_score: number;\n  status: \"PENDING\" | \"APPROVED\" | \"REJECTED\";\n  created_at: string;\n}\ninterface SystemEventLog {\n  id: string;\n  type: string;\n  title: string;\n  description: string;\n  timestamp: string;\n  severity: \"info\" | \"warning\" | \"success\" | \"error\";\n}\n\n\n// === FILE: src/services/api.client.ts ===\n/**\n * Centralized REST & Realtime (WebSocket / SSE) Client for Smart Parking FastAPI Backend.\n * Automatically adapts to localhost, LAN IP (192.168.x.x), or Public HTTPS Tunnel / Cloud URL\n * so external viewers never hit hardcoded 127.0.0.1 on their own device.\n */\n\nconst TOKEN_STORAGE_KEY = \"pbl4_smart_parking_jwt_token\";\n\nfunction resolveApiBaseUrl(): string {\n  const envUrl = (\"http://127.0.0.1:8000\" as string | undefined)?.replace(/\\/+$/, \"\");\n  if (typeof window === \"undefined\") {\n    return envUrl || \"http://127.0.0.1:8000\";\n  }\n  const { protocol, hostname, port, origin } = window.location;\n  // If served directly from the unified FastAPI server (port 8000) or via an HTTPS public tunnel (port 80/443)\n  if (port === \"8000\" || port === \"\" || protocol === \"https:\") {\n    return origin;\n  }\n  // If served from separate frontend dev server (port 5173) over LAN IP or localhost\n  if (hostname && hostname !== \"localhost\" && hostname !== \"127.0.0.1\") {\n    return `${protocol}//${hostname}:8000`;\n  }\n  return envUrl || \"http://127.0.0.1:8000\";\n}\n\nfunction resolveWsUrl(apiBase: string): string {\n  const envWs = import.meta.env.VITE_WS_URL as string | undefined;\n  if (typeof window !== \"undefined\") {\n    const { protocol, hostname, port, host } = window.location;\n    const wsProto = protocol === \"https:\" ? \"wss:\" : \"ws:\";\n    if (port === \"8000\" || port === \"\" || protocol === \"https:\") {\n      return `${wsProto}//${host}/api/ws`;\n    }\n    if (hostname && hostname !== \"localhost\" && hostname !== \"127.0.0.1\") {\n      return `${wsProto}//${hostname}:8000/api/ws`;\n    }\n  }\n  return envWs || `${apiBase.replace(/^http/, \"ws\")}/api/ws`;\n}\nconst API_BASE_URL: string = resolveApiBaseUrl();\nconst WS_URL: string = resolveWsUrl(API_BASE_URL);\nclass ApiError extends Error {\n  public readonly status: number;\n  public readonly reasonCode: string;\n  public readonly details: Record<string, unknown>;\n\n  constructor(\n    status: number,\n    reasonCode: string,\n    message: string,\n    details: Record<string, unknown> = {}\n  ) {\n    super(message);\n    this.name = \"ApiError\";\n    this.status = status;\n    this.reasonCode = reasonCode;\n    this.details = details;\n  }\n}\nclass ApiClient {\n  static getToken(): string | null {\n    try {\n      return window.sessionStorage.getItem(TOKEN_STORAGE_KEY);\n    } catch {\n      return null;\n    }\n  }\n\n  static setToken(token: string | null): void {\n    try {\n      if (token) {\n        window.sessionStorage.setItem(TOKEN_STORAGE_KEY, token);\n      } else {\n        window.sessionStorage.removeItem(TOKEN_STORAGE_KEY);\n      }\n    } catch {\n      // ignore storage errors\n    }\n  }\n\n  static async request<T>(\n    path: string,\n    options: RequestInit = {}\n  ): Promise<T> {\n    const token = ApiClient.getToken();\n    const headers: Record<string, string> = {\n      Accept: \"application/json\",\n      ...(options.headers as Record<string, string> | undefined),\n    };\n    if (options.body && !headers[\"Content-Type\"]) {\n      headers[\"Content-Type\"] = \"application/json\";\n    }\n    if (token) {\n      headers[\"Authorization\"] = `Bearer ${token}`;\n    }\n\n    const url = path.startsWith(\"http\")\n      ? path\n      : `${API_BASE_URL}${path.startsWith(\"/\") ? \"\" : \"/\"}${path}`;\n\n    let response: Response;\n    try {\n      response = await fetch(url, {\n        ...options,\n        headers,\n        credentials: \"include\",\n      });\n    } catch (networkErr) {\n      throw new ApiError(\n        0,\n        \"NETWORK_ERROR\",\n        `Kh\u00f4ng th\u1ec3 k\u1ebft n\u1ed1i t\u1edbi m\u00e1y ch\u1ee7 FastAPI (${API_BASE_URL}). Vui l\u00f2ng ki\u1ec3m tra Edge Server \u0111ang ch\u1ea1y.`,\n        { originalError: String(networkErr) }\n      );\n    }\n\n    let payload: Record<string, unknown> = {};\n    try {\n      payload = (await response.json()) as Record<string, unknown>;\n    } catch {\n      payload = {};\n    }\n\n    if (!response.ok) {\n      const reasonCode =\n        (payload.reason_code as string) ||\n        (payload.error as string) ||\n        `HTTP_${response.status}`;\n      const message =\n        (payload.message as string) ||\n        (payload.detail as string) ||\n        `L\u1ed7i m\u00e1y ch\u1ee7 (HTTP ${response.status})`;\n      const details =\n        (payload.details as Record<string, unknown>) || {};\n      throw new ApiError(response.status, reasonCode, message, details);\n    }\n\n    return payload as unknown as T;\n  }\n\n  static get<T>(path: string, headers?: Record<string, string>): Promise<T> {\n    return ApiClient.request<T>(path, { method: \"GET\", headers });\n  }\n\n  static post<T>(\n    path: string,\n    body?: unknown,\n    headers?: Record<string, string>\n  ): Promise<T> {\n    return ApiClient.request<T>(path, {\n      method: \"POST\",\n      body: body !== undefined ? JSON.stringify(body) : undefined,\n      headers,\n    });\n  }\n\n  /**\n   * Connect to FastAPI realtime WebSocket (/api/ws) with automatic SSE (/api/events/stream) fallback.\n   */\n  static subscribeRealtime(\n    onEvent: (envelope: RealtimeEnvelope) => void,\n    onStatusChange?: (connected: boolean) => void\n  ): () => void {\n    let closed = false;\n    let ws: WebSocket | null = null;\n    let sse: EventSource | null = null;\n    let reconnectTimer: number | null = null;\n\n    const cleanup = () => {\n      if (reconnectTimer !== null) {\n        window.clearTimeout(reconnectTimer);\n        reconnectTimer = null;\n      }\n      if (ws) {\n        try {\n          ws.close();\n        } catch {\n          // ignore\n        }\n        ws = null;\n      }\n      if (sse) {\n        try {\n          sse.close();\n        } catch {\n          // ignore\n        }\n        sse = null;\n      }\n    };\n\n    const connectSSE = () => {\n      if (closed) return;\n      try {\n        sse = new EventSource(`${API_BASE_URL}/api/events/stream`, {\n          withCredentials: true,\n        });\n        sse.onopen = () => {\n          onStatusChange?.(true);\n        };\n        sse.onmessage = (ev) => {\n          try {\n            const parsed = JSON.parse(ev.data) as RealtimeEnvelope;\n            onEvent(parsed);\n          } catch {\n            // ignore malformed frame\n          }\n        };\n        sse.onerror = () => {\n          onStatusChange?.(false);\n        };\n      } catch {\n        onStatusChange?.(false);\n      }\n    };\n\n    const connectWS = () => {\n      if (closed) return;\n      try {\n        ws = new WebSocket(WS_URL);\n        ws.onopen = () => {\n          onStatusChange?.(true);\n        };\n        ws.onmessage = (ev) => {\n          try {\n            const parsed = JSON.parse(ev.data) as RealtimeEnvelope;\n            onEvent(parsed);\n          } catch {\n            // ignore malformed frame\n          }\n        };\n        ws.onerror = () => {\n          onStatusChange?.(false);\n        };\n        ws.onclose = () => {\n          onStatusChange?.(false);\n          if (!closed) {\n            reconnectTimer = window.setTimeout(connectWS, 3000);\n          }\n        };\n      } catch {\n        connectSSE();\n      }\n    };\n\n    connectWS();\n\n    return () => {\n      closed = true;\n      cleanup();\n    };\n  }\n}\n\n\n// === FILE: src/services/auth.service.ts ===\ninterface LoginResponse {\n  access_token: string;\n  token_type: string;\n  expires_in: number;\n  user: UserProfile;\n  server_time: string;\n}\nclass AuthService {\n  static async login(username: string, password: string): Promise<LoginResponse> {\n    const res = await ApiClient.post<LoginResponse>(\"/api/auth/login\", {\n      username,\n      password,\n    });\n    ApiClient.setToken(res.access_token);\n    return res;\n  }\n\n  static async logout(): Promise<void> {\n    try {\n      await ApiClient.post(\"/api/auth/logout\");\n    } finally {\n      ApiClient.setToken(null);\n    }\n  }\n\n  static async getCurrentUser(): Promise<UserProfile> {\n    return ApiClient.get<UserProfile>(\"/api/me\");\n  }\n}\n\n\n// === FILE: src/services/parking.service.ts ===\ninterface CurrentBookingResponse {\n  booking: BookingDTO | null;\n  server_time: string;\n  server_time_vn: string;\n}\ninterface UserHistoryResponse {\n  bookings: BookingDTO[];\n  sessions: SessionDTO[];\n  limit: number;\n  offset: number;\n  server_time: string;\n  server_time_vn: string;\n}\nclass ParkingService {\n  /**\n   * L\u1ea5y tr\u1ea1ng th\u00e1i 4 \u00f4 \u0111\u1ed7 (A1, A2, B1, B2) k\u00e8m server_time t\u1eeb FastAPI + MySQL.\n   */\n  static async getSlots(): Promise<SlotsResponse> {\n    return ApiClient.get<SlotsResponse>(\"/api/slots\");\n  }\n\n  /**\n   * \u0110\u1eb7t gi\u1eef \u00f4 60 ph\u00fat cho xe \u0111\u1ecbnh danh c\u1ee7a USER \u0111ang \u0111\u0103ng nh\u1eadp.\n   */\n  static async createBooking(\n    vehicleId: number,\n    slotId: SlotId,\n    idempotencyKey?: string\n  ): Promise<BookingDTO> {\n    const headers: Record<string, string> = {};\n    if (idempotencyKey) {\n      headers[\"X-Idempotency-Key\"] = idempotencyKey;\n    }\n    return ApiClient.post<BookingDTO>(\n      \"/api/bookings\",\n      {\n        vehicle_id: vehicleId,\n        slot_id: slotId,\n        idempotency_key: idempotencyKey,\n      },\n      headers\n    );\n  }\n\n  /**\n   * L\u1ea5y booking \u0111ang hi\u1ec7u l\u1ef1c c\u1ee7a USER k\u00e8m server_time \u0111\u1ec3 \u0111\u1ed3ng b\u1ed9 \u0111\u1ed3ng h\u1ed3 \u0111\u1ebfm ng\u01b0\u1ee3c khi F5.\n   */\n  static async getCurrentBooking(): Promise<CurrentBookingResponse> {\n    return ApiClient.get<CurrentBookingResponse>(\"/api/bookings/current\");\n  }\n\n  /**\n   * H\u1ee7y \u0111\u1eb7t ch\u1ed7 khi c\u00f2n \u1edf tr\u1ea1ng th\u00e1i Reserved v\u00e0 ch\u01b0a b\u01b0\u1edbc v\u00e0o l\u01b0\u1ee3t check-in t\u1ea1i c\u1ed5ng.\n   */\n  static async cancelBooking(bookingId: string): Promise<BookingDTO> {\n    return ApiClient.post<BookingDTO>(`/api/bookings/${bookingId}/cancel`);\n  }\n\n  /**\n   * L\u1ea5y l\u1ecbch s\u1eed \u0111\u1eb7t ch\u1ed7 v\u00e0 l\u1ecbch s\u1eed g\u1eedi xe c\u1ee7a ch\u00ednh USER \u0111ang \u0111\u0103ng nh\u1eadp.\n   */\n  static async getMyHistory(params?: {\n    bookingStatus?: string;\n    sessionStatus?: string;\n    limit?: number;\n    offset?: number;\n  }): Promise<UserHistoryResponse> {\n    const q = new URLSearchParams();\n    if (params?.bookingStatus) q.set(\"booking_status\", params.bookingStatus);\n    if (params?.sessionStatus) q.set(\"session_status\", params.sessionStatus);\n    if (params?.limit) q.set(\"limit\", String(params.limit));\n    if (params?.offset) q.set(\"offset\", String(params.offset));\n    const qs = q.toString();\n    return ApiClient.get<UserHistoryResponse>(\n      `/api/me/history${qs ? `?${qs}` : \"\"}`\n    );\n  }\n}\n\n\n// === FILE: src/services/session.service.ts ===\ninterface AdminSessionsResponse {\n  sessions: SessionDTO[];\n  count: number;\n  server_time: string;\n  server_time_vn: string;\n}\ninterface AdminBookingsResponse {\n  bookings: BookingDTO[];\n  count: number;\n  server_time: string;\n  server_time_vn: string;\n}\ninterface AdminDevicesResponse {\n  overall_status: \"HEALTHY\" | \"DEGRADED_OR_STALE\";\n  slot_stale_seconds: number;\n  sensors: DeviceSensorHealth[];\n  server_time: string;\n  server_time_vn: string;\n}\nclass SessionService {\n  static async listAdminSessions(status?: string): Promise<AdminSessionsResponse> {\n    const qs = status ? `?status=${encodeURIComponent(status)}` : \"\";\n    return ApiClient.get<AdminSessionsResponse>(`/api/admin/sessions${qs}`);\n  }\n\n  static async listAdminBookings(status?: string): Promise<AdminBookingsResponse> {\n    const qs = status ? `?status=${encodeURIComponent(status)}` : \"\";\n    return ApiClient.get<AdminBookingsResponse>(`/api/admin/bookings${qs}`);\n  }\n\n  static async getAdminDevices(): Promise<AdminDevicesResponse> {\n    return ApiClient.get<AdminDevicesResponse>(\"/api/admin/devices\");\n  }\n}\n\n\n// === FILE: src/services/review.service.ts ===\ninterface AdminReviewsResponse {\n  reviews: ManualReviewItem[];\n  count: number;\n  server_time: string;\n  server_time_vn: string;\n}\nclass ReviewService {\n  static async listAdminReviews(includeResolved = false): Promise<AdminReviewsResponse> {\n    return ApiClient.get<AdminReviewsResponse>(\n      `/api/admin/reviews?include_resolved=${includeResolved ? \"true\" : \"false\"}`\n    );\n  }\n\n  static async submitDecision(\n    eventId: string,\n    action: \"APPROVE\" | \"DENY\",\n    reason: string\n  ): Promise<Record<string, unknown>> {\n    return ApiClient.post<Record<string, unknown>>(\n      `/api/admin/reviews/${encodeURIComponent(eventId)}/decision`,\n      { action, reason }\n    );\n  }\n}\n\n\n// === FILE: src/features/user-portal/FirstPersonDriverModal.tsx ===\n\n\ninterface FirstPersonDriverModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  slotId: SlotId;\n  plateDisplay: string;\n  bookingId: string;\n}\n\ninterface RouteConfig {\n  slotId: SlotId;\n  zoneLabel: string;\n  turnDirection: \"LEFT\" | \"RIGHT\";\n  turnLabelVi: string;\n  distanceMeters: number;\n  steeringAngleDeg: number;\n  aisleDepthLabel: string;\n  hudInstructionStage2: string;\n  hudInstructionStage3: string;\n  radarPathPoints: string;\n  radarTargetCoords: { cx: number; cy: number };\n}\n\nconst ROUTE_CONFIGS: Record<SlotId, RouteConfig> = {\n  A1: {\n    slotId: \"A1\",\n    zoneLabel: \"D\u00e3y A \u2022 C\u00e1nh Tr\u00e1i (G\u1ea7n C\u1ed5ng V\u00e0o)\",\n    turnDirection: \"LEFT\",\n    turnLabelVi: \"\u0110\u00e1nh l\u00e1i R\u1ebc TR\u00c1I 90\u00b0 v\u00e0o \u00f4 A1\",\n    distanceMeters: 12,\n    steeringAngleDeg: -65,\n    aisleDepthLabel: \"Tr\u1ee5c ch\u00ednh \u2022 \u0110i\u1ec3m r\u1ebd D\u00e3y A (12m)\",\n    hudInstructionStage2: \"Ti\u1ebfn th\u1eb3ng 12m qua barie v\u00e0o tr\u1ee5c \u0111\u01b0\u1eddng ch\u00ednh t\u1edbi \u0111i\u1ec3m r\u1ebd D\u00e3y A\",\n    hudInstructionStage3: \"\u0110\u00e1nh v\u00f4 l\u0103ng sang TR\u00c1I (-65\u00b0), r\u1ebd v\u00e0o khoang \u0111\u1ed7 A1 b\u00ean tr\u00e1i\",\n    radarPathPoints: \"100,175 100,115 48,115\",\n    radarTargetCoords: { cx: 48, cy: 115 },\n  },\n  A2: {\n    slotId: \"A2\",\n    zoneLabel: \"D\u00e3y A \u2022 C\u00e1nh Ph\u1ea3i (G\u1ea7n C\u1ed5ng V\u00e0o)\",\n    turnDirection: \"RIGHT\",\n    turnLabelVi: \"\u0110\u00e1nh l\u00e1i R\u1ebc PH\u1ea2I 90\u00b0 v\u00e0o \u00f4 A2\",\n    distanceMeters: 12,\n    steeringAngleDeg: 65,\n    aisleDepthLabel: \"Tr\u1ee5c ch\u00ednh \u2022 \u0110i\u1ec3m r\u1ebd D\u00e3y A (12m)\",\n    hudInstructionStage2: \"Ti\u1ebfn th\u1eb3ng 12m qua barie v\u00e0o tr\u1ee5c \u0111\u01b0\u1eddng ch\u00ednh t\u1edbi \u0111i\u1ec3m r\u1ebd D\u00e3y A\",\n    hudInstructionStage3: \"\u0110\u00e1nh v\u00f4 l\u0103ng sang PH\u1ea2I (+65\u00b0), r\u1ebd v\u00e0o khoang \u0111\u1ed7 A2 b\u00ean ph\u1ea3i\",\n    radarPathPoints: \"100,175 100,115 152,115\",\n    radarTargetCoords: { cx: 152, cy: 115 },\n  },\n  B1: {\n    slotId: \"B1\",\n    zoneLabel: \"D\u00e3y B \u2022 C\u00e1nh Tr\u00e1i (Ph\u00eda Trong B\u00e3i)\",\n    turnDirection: \"LEFT\",\n    turnLabelVi: \"Ti\u1ebfn qua D\u00e3y A, \u0111\u00e1nh l\u00e1i R\u1ebc TR\u00c1I 90\u00b0 v\u00e0o \u00f4 B1\",\n    distanceMeters: 24,\n    steeringAngleDeg: -65,\n    aisleDepthLabel: \"Tr\u1ee5c ch\u00ednh \u2022 \u0110i\u1ec3m r\u1ebd D\u00e3y B (24m)\",\n    hudInstructionStage2: \"Ti\u1ebfn th\u1eb3ng 24m qua D\u00e3y A \u0111\u1ec3 v\u00e0o s\u00e2u khu v\u1ef1c D\u00e3y B\",\n    hudInstructionStage3: \"\u0110\u00e1nh v\u00f4 l\u0103ng sang TR\u00c1I (-65\u00b0), r\u1ebd v\u00e0o khoang \u0111\u1ed7 B1 b\u00ean tr\u00e1i\",\n    radarPathPoints: \"100,175 100,60 48,60\",\n    radarTargetCoords: { cx: 48, cy: 60 },\n  },\n  B2: {\n    slotId: \"B2\",\n    zoneLabel: \"D\u00e3y B \u2022 C\u00e1nh Ph\u1ea3i (Ph\u00eda Trong B\u00e3i)\",\n    turnDirection: \"RIGHT\",\n    turnLabelVi: \"Ti\u1ebfn qua D\u00e3y A, \u0111\u00e1nh l\u00e1i R\u1ebc PH\u1ea2I 90\u00b0 v\u00e0o \u00f4 B2\",\n    distanceMeters: 24,\n    steeringAngleDeg: 65,\n    aisleDepthLabel: \"Tr\u1ee5c ch\u00ednh \u2022 \u0110i\u1ec3m r\u1ebd D\u00e3y B (24m)\",\n    hudInstructionStage2: \"Ti\u1ebfn th\u1eb3ng 24m qua D\u00e3y A \u0111\u1ec3 v\u00e0o s\u00e2u khu v\u1ef1c D\u00e3y B\",\n    hudInstructionStage3: \"\u0110\u00e1nh v\u00f4 l\u0103ng sang PH\u1ea2I (+65\u00b0), r\u1ebd v\u00e0o khoang \u0111\u1ed7 B2 b\u00ean ph\u1ea3i\",\n    radarPathPoints: \"100,175 100,60 152,60\",\n    radarTargetCoords: { cx: 152, cy: 60 },\n  },\n};\n\nconst STAGE_TITLES = [\n  \"1. D\u1eebng t\u1ea1i C\u1ed5ng V\u00e0o (Gate IN) \u2022 Nh\u1eadn di\u1ec7n & M\u1edf Barie\",\n  \"2. Ti\u1ebfn qua C\u1ed5ng V\u00e0o tr\u1ee5c \u0111\u01b0\u1eddng ch\u00ednh c\u1ee7a b\u00e3i \u0111\u1ed7\",\n  \"3. \u0110\u00e1nh l\u00e1i r\u1ebd v\u00e0o \u0111\u00fang khoang \u00f4 \u0111\u1ed7 \u0111\u00e3 \u0111\u1eb7t\",\n  \"4. Xe v\u00e0o v\u1ecb tr\u00ed \u0111\u1ed7 ngay ng\u1eafn trong \u00f4 \u2022 Ho\u00e0n t\u1ea5t\",\n];\nconst FirstPersonDriverModal: React.FC<FirstPersonDriverModalProps> = ({\n  isOpen,\n  onClose,\n  slotId,\n  plateDisplay,\n  bookingId,\n}) => {\n  // stage: 0 = Gate IN & Barrier Opening, 1 = Main Aisle Cruise, 2 = Turning into Slot, 3 = Parked in Slot\n  const [stage, setStage] = useState<number>(0);\n  const [isPlaying, setIsPlaying] = useState<boolean>(true);\n  const [barrierOpen, setBarrierOpen] = useState<boolean>(false);\n\n  const route = ROUTE_CONFIGS[slotId] || ROUTE_CONFIGS.A1;\n\n  // Reset & auto-play when modal opens\n  useEffect(() => {\n    if (!isOpen) return;\n    setStage(0);\n    setIsPlaying(true);\n    setBarrierOpen(false);\n    const openTimer = window.setTimeout(() => setBarrierOpen(true), 600);\n    return () => window.clearTimeout(openTimer);\n  }, [isOpen, slotId]);\n\n  // Automatic stage progression when isPlaying is true\n  useEffect(() => {\n    if (!isOpen || !isPlaying) return;\n\n    if (stage === 0) {\n      const bTimer = window.setTimeout(() => setBarrierOpen(true), 500);\n      const nextTimer = window.setTimeout(() => setStage(1), 2600);\n      return () => {\n        window.clearTimeout(bTimer);\n        window.clearTimeout(nextTimer);\n      };\n    }\n\n    if (stage < 3) {\n      const timer = window.setTimeout(() => {\n        setStage((prev) => Math.min(3, prev + 1));\n      }, 2600);\n      return () => window.clearTimeout(timer);\n    } else {\n      setIsPlaying(false);\n    }\n  }, [isOpen, isPlaying, stage]);\n\n  if (!isOpen) return null;\n\n  const handleReplay = () => {\n    setBarrierOpen(false);\n    setStage(0);\n    setIsPlaying(true);\n  };\n\n  const handleStepChange = (targetStage: number) => {\n    setIsPlaying(false);\n    setStage(targetStage);\n    setBarrierOpen(true);\n  };\n\n  // Compute steering wheel rotation & speed for current stage\n  const currentWheelAngle =\n    stage === 2 ? route.steeringAngleDeg : stage === 3 ? 0 : 0;\n  const currentSpeedKmh =\n    stage === 0 ? (barrierOpen ? 5 : 0) : stage === 1 ? 12 : stage === 2 ? 7 : 0;\n  const remainingDistMeters =\n    stage === 0\n      ? route.distanceMeters\n      : stage === 1\n      ? Math.round(route.distanceMeters * 0.45)\n      : stage === 2\n      ? 3\n      : 0;\n\n  // Perspective camera transform inside windshield\n  const worldScale =\n    stage === 0 ? 1.0 : stage === 1 ? 1.16 : stage === 2 ? 1.28 : 1.38;\n  const worldShiftX =\n    stage >= 2\n      ? route.turnDirection === \"LEFT\"\n        ? 85\n        : -85\n      : 0;\n\n  return (\n    <div\n      className=\"fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4\"\n      role=\"dialog\"\n      aria-modal=\"true\"\n      aria-label={`M\u00f4 ph\u1ecfng g\u00f3c nh\u00ecn ng\u01b0\u1eddi l\u00e1i t\u1edbi \u00f4 ${slotId}`}\n    >\n      <div className=\"bg-slate-900 border-2 border-slate-700 rounded-2xl max-w-5xl w-full overflow-hidden shadow-2xl flex flex-col text-white\">\n        {/* Top Modal Header */}\n        <div className=\"bg-slate-950 px-4 py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2\">\n          <div className=\"flex items-center gap-3\">\n            <span className=\"px-2.5 py-1 rounded-lg bg-amber-400 text-slate-950 font-black text-xs uppercase tracking-wider\">\n              POV \u2022 G\u00f3c Nh\u00ecn Sau V\u00f4 L\u0103ng\n            </span>\n            <div>\n              <h3 className=\"text-sm sm:text-base font-extrabold text-white flex items-center gap-2\">\n                <span>M\u00f4 Ph\u1ecfng L\u1ed9 Tr\u00ecnh D\u1eabn \u0110\u01b0\u1eddng V\u00e0o \u00d4 \u0110\u1ed7 {slotId}</span>\n                <span className=\"text-xs font-mono bg-blue-900/70 text-sky-300 px-2 py-0.5 rounded border border-sky-700\">\n                  Bi\u1ec3n s\u1ed1: {plateDisplay}\n                </span>\n              </h3>\n              <p className=\"text-[11px] text-slate-400\">\n                {route.zoneLabel} \u2022 M\u00f4 ph\u1ecfng tr\u1ef1c quan tr\u00ean giao di\u1ec7n (Kh\u00f4ng ph\u00e1t l\u1ec7nh m\u1edf barie ph\u1ea7n c\u1ee9ng th\u1eadt)\n              </p>\n            </div>\n          </div>\n\n          <button\n            onClick={onClose}\n            className=\"bg-slate-800 hover:bg-red-600 text-slate-200 hover:text-white px-3 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer border border-slate-700\"\n          >\n            \u2715 Tho\u00e1t m\u00f4 ph\u1ecfng\n          </button>\n        </div>\n\n        {/* Windshield First-Person Cockpit Viewport */}\n        <div className=\"relative h-[430px] sm:h-[470px] w-full bg-gradient-to-b from-slate-950 via-slate-900 to-slate-800 overflow-hidden select-none\">\n          {/* Left & Right Cockpit A-Pillars */}\n          <div\n            className=\"absolute inset-y-0 left-0 w-8 sm:w-14 bg-gradient-to-r from-slate-950 via-slate-900 to-transparent z-20 pointer-events-none border-r border-slate-800/50\"\n            style={{ transform: \"skewX(-6deg) translateX(-10px)\" }}\n          />\n          <div\n            className=\"absolute inset-y-0 right-0 w-8 sm:w-14 bg-gradient-to-l from-slate-950 via-slate-900 to-transparent z-20 pointer-events-none border-l border-slate-800/50\"\n            style={{ transform: \"skewX(6deg) translateX(10px)\" }}\n          />\n\n          {/* Top Rearview Mirror & HUD Status Pill */}\n          <div className=\"absolute top-3 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center\">\n            <div className=\"w-44 h-8 bg-slate-950/90 border-2 border-slate-700 rounded-b-2xl shadow-lg flex items-center justify-center gap-2 px-3\">\n              <span\n                className={`w-2 h-2 rounded-full ${\n                  stage === 3 ? \"bg-emerald-400\" : \"bg-sky-400 animate-ping\"\n                }`}\n              />\n              <span className=\"text-[11px] font-bold tracking-wider text-slate-200 uppercase\">\n                HUD \u2022 \u0110\u00cdCH: \u00d4 {slotId}\n              </span>\n            </div>\n          </div>\n\n          {/* Top-Left HUD Navigation Turn Box */}\n          <div className=\"absolute top-4 left-6 sm:left-14 z-30 bg-slate-950/85 border border-sky-500/40 rounded-xl p-3 shadow-xl max-w-xs backdrop-blur-md\">\n            <div className=\"flex items-center gap-2.5\">\n              <div\n                className={`w-10 h-10 rounded-xl flex items-center justify-center text-xl font-black ${\n                  stage === 3\n                    ? \"bg-emerald-500 text-slate-950\"\n                    : route.turnDirection === \"LEFT\"\n                    ? \"bg-sky-500 text-slate-950\"\n                    : \"bg-amber-400 text-slate-950\"\n                }`}\n              >\n                {stage === 0\n                  ? \"\u2b06\ufe0f\"\n                  : stage === 1\n                  ? \"\u2b06\ufe0f\"\n                  : stage === 2\n                  ? route.turnDirection === \"LEFT\"\n                    ? \"\u21b0\"\n                    : \"\u21b1\"\n                  : \"\ud83c\udd7f\ufe0f\"}\n              </div>\n              <div>\n                <div className=\"text-[10px] font-bold uppercase tracking-wider text-sky-400\">\n                  {STAGE_TITLES[stage]}\n                </div>\n                <div className=\"text-xs font-extrabold text-white mt-0.5\">\n                  {stage === 0 &&\n                    (barrierOpen\n                      ? \"Barie C\u1ed5ng V\u00e0o \u0110\u00c3 M\u1ede \u2014 Ti\u1ebfn th\u1eb3ng qua c\u1ed5ng\"\n                      : \"\u0110ang \u0111\u1ed1i so\u00e1t Bi\u1ec3n s\u1ed1 & Khu\u00f4n m\u1eb7t 1:1 t\u1ea1i Gate IN...\")}\n                  {stage === 1 && route.hudInstructionStage2}\n                  {stage === 2 && route.hudInstructionStage3}\n                  {stage === 3 &&\n                    `\u0110\u00e3 \u0111\u1ed7 ho\u00e0n t\u1ea5t v\u00e0o ch\u00ednh gi\u1eefa \u00f4 ${slotId}! C\u1ea3m bi\u1ebfn IR_${slotId} ghi nh\u1eadn v\u1ecb tr\u00ed.`}\n                </div>\n              </div>\n            </div>\n            <div className=\"mt-2 pt-2 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-300\">\n              <span>Kho\u1ea3ng c\u00e1ch t\u1edbi \u00f4 {slotId}:</span>\n              <span className=\"font-mono font-bold text-emerald-400\">\n                {remainingDistMeters} m\n              </span>\n            </div>\n          </div>\n\n          {/* Top-Right 2D Mini Floor-Plan Radar */}\n          <div className=\"absolute top-4 right-6 sm:right-14 z-30 bg-slate-950/90 border border-slate-700 rounded-xl p-2.5 shadow-xl w-44 backdrop-blur-md\">\n            <div className=\"text-[10px] font-bold text-slate-400 uppercase tracking-wider text-center mb-1\">\n              Sa B\u00e0n M\u1eb7t B\u1eb1ng (Tuy\u1ebfn {slotId})\n            </div>\n            <svg viewBox=\"0 0 200 190\" className=\"w-full h-28 bg-slate-900 rounded-lg border border-slate-800\">\n              {/* Central driving lane */}\n              <rect x=\"82\" y=\"15\" width=\"36\" height=\"165\" fill=\"#1e293b\" />\n              <line\n                x1=\"100\"\n                y1=\"20\"\n                x2=\"100\"\n                y2=\"175\"\n                stroke=\"#475569\"\n                strokeWidth=\"2\"\n                strokeDasharray=\"5,5\"\n              />\n\n              {/* 4 Parking Slots on Radar: B1 (top-left), B2 (top-right), A1 (mid-left), A2 (mid-right) */}\n              {(\n                [\n                  { id: \"B1\", x: 18, y: 38 },\n                  { id: \"B2\", x: 126, y: 38 },\n                  { id: \"A1\", x: 18, y: 94 },\n                  { id: \"A2\", x: 126, y: 94 },\n                ] as const\n              ).map((s) => {\n                const isTarget = s.id === slotId;\n                return (\n                  <g key={s.id}>\n                    <rect\n                      x={s.x}\n                      y={s.y}\n                      width=\"56\"\n                      height=\"42\"\n                      rx=\"5\"\n                      fill={isTarget ? \"rgba(16, 185, 129, 0.25)\" : \"#0f172a\"}\n                      stroke={isTarget ? \"#10b981\" : \"#334155\"}\n                      strokeWidth={isTarget ? \"2.5\" : \"1.5\"}\n                    />\n                    <text\n                      x={s.x + 28}\n                      y={s.y + 25}\n                      textAnchor=\"middle\"\n                      fill={isTarget ? \"#34d399\" : \"#94a3b8\"}\n                      fontSize=\"13\"\n                      fontWeight=\"bold\"\n                    >\n                      {s.id}\n                    </text>\n                  </g>\n                );\n              })}\n\n              {/* Gate IN bar at bottom */}\n              <rect x=\"76\" y=\"166\" width=\"48\" height=\"10\" rx=\"2\" fill=\"#f59e0b\" />\n              <text x=\"100\" y=\"186\" textAnchor=\"middle\" fill=\"#fbbf24\" fontSize=\"9\" fontWeight=\"bold\">\n                GATE IN\n              </text>\n\n              {/* Highlighted Route Polyline */}\n              <polyline\n                points={route.radarPathPoints}\n                fill=\"none\"\n                stroke=\"#38bdf8\"\n                strokeWidth=\"3.5\"\n                strokeLinecap=\"round\"\n                strokeLinejoin=\"round\"\n              />\n\n              {/* Moving vehicle dot on radar */}\n              <circle\n                cx={\n                  stage === 0\n                    ? 100\n                    : stage === 1\n                    ? 100\n                    : stage === 2\n                    ? route.turnDirection === \"LEFT\"\n                      ? 74\n                      : 126\n                    : route.radarTargetCoords.cx\n                }\n                cy={\n                  stage === 0\n                    ? 170\n                    : stage === 1\n                    ? slotId.startsWith(\"A\")\n                      ? 125\n                      : 85\n                    : route.radarTargetCoords.cy\n                }\n                r=\"6\"\n                fill=\"#facc15\"\n                stroke=\"#0f172a\"\n                strokeWidth=\"2\"\n              />\n            </svg>\n          </div>\n\n          {/* 3D Perspective Windshield Scene (SVG) */}\n          <div\n            className=\"w-full h-full flex items-center justify-center transition-transform duration-700 ease-out\"\n            style={{\n              transform: `scale(${worldScale}) translateX(${worldShiftX}px)`,\n            }}\n          >\n            <svg viewBox=\"0 0 800 420\" className=\"w-full h-full\">\n              <defs>\n                <linearGradient id=\"skyGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                  <stop offset=\"0%\" stopColor=\"#020617\" />\n                  <stop offset=\"100%\" stopColor=\"#0f172a\" />\n                </linearGradient>\n                <linearGradient id=\"roadGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                  <stop offset=\"0%\" stopColor=\"#1e293b\" />\n                  <stop offset=\"100%\" stopColor=\"#334155\" />\n                </linearGradient>\n              </defs>\n\n              {/* Ceiling / Background */}\n              <rect x=\"0\" y=\"0\" width=\"800\" height=\"170\" fill=\"url(#skyGrad)\" />\n\n              {/* Parking Structure Pillars & Overhead Sign */}\n              <rect x=\"240\" y=\"45\" width=\"320\" height=\"34\" rx=\"6\" fill=\"#004b87\" stroke=\"#38bdf8\" strokeWidth=\"1.5\" />\n              <text x=\"400\" y=\"67\" textAnchor=\"middle\" fill=\"#ffffff\" fontSize=\"14\" fontWeight=\"bold\">\n                B\u00c3I \u0110\u1ed6 XE TH\u00d4NG MINH PBL4 \u2022 KHU A (A1-A2) &amp; KHU B (B1-B2)\n              </text>\n\n              {/* Perspective Road / Floor */}\n              <polygon points=\"0,420 270,170 530,170 800,420\" fill=\"url(#roadGrad)\" />\n\n              {/* Left & Right Parking Bays in Perspective */}\n              {/* Far Row B (B1 Left, B2 Right) */}\n              <polygon\n                points=\"155,235 255,180 285,205 195,265\"\n                fill={slotId === \"B1\" ? \"rgba(16, 185, 129, 0.35)\" : \"rgba(15,
