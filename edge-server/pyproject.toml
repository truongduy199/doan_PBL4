[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-parking-edge"
version = "0.2.0"
description = "Edge Server cho hệ thống Bãi đỗ xe thông minh PBL4 (MySQL/InnoDB + FastAPI + Realtime)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "PBL4 Smart Parking Team" }
]
dependencies = [
    "insightface>=0.7.3",
    "onnxruntime>=1.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pyserial>=3.5",
    "paho-mqtt>=2.1,<3",
    "zeroconf>=0.132",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "mysql-connector-python>=8.1.0",
    "PyMySQL>=1.1.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0"
]

# Install the in-repository plate package as well: pip install -e ../modules/license_plate_yolo_numpy

[tool.setuptools.packages.find]
where = ["src"]
