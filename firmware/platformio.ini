[platformio]
src_dir = esp32_smart_parking
default_envs = plate-controller, face-camera

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1
    olikraus/U8g2@2.36.5

[env:plate-controller]
build_unflags = -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=0
build_flags = ${env.build_flags} -DBOARD_ROLE=1 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:face-camera]
build_flags = ${env.build_flags} -DBOARD_ROLE=2

[env:wokwi-controller]
build_flags = ${env.build_flags} -DBOARD_ROLE=1 -DENABLE_OV5640_CAMERA=0 -DENABLE_WOKWI_SERIAL_SIM=1
