[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "license-plate-yolo-numpy"
version = "0.1.0"
description = "Vietnamese license plate recognition with YOLO and NumPy OCR"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
license-plate-reader = "license_plate_yolo_numpy.cli:main"

[tool.setuptools]
packages = ["license_plate_yolo_numpy"]
include-package-data = false

[tool.setuptools.package-data]
license_plate_yolo_numpy = ["weights/best.pt", "weights/ocr_coco_weights.npz"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
